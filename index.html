<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cafetería Juan Bosco</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .jb-brand { font-family: 'Fraunces', serif; }
  .jb-mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-[#F4F1EB]">
<div id="app"></div>

<script>
const SUPABASE_URL = "https://pvqmncpebgrmoondwmib.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2cW1uY3BlYmdybW9vbmR3bWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Mzg4ODMsImV4cCI6MjEwMjMxNDg4M30.LKVzQwWWlfn1Cir332ZWax5UskxkKJtq5Q4-yGl6v44";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PASSWORD_RULES = [
  { label: "Mínimo 6 caracteres", test: p => p.length >= 6 },
  { label: "Al menos 1 mayúscula", test: p => /[A-Z]/.test(p) },
  { label: "Al menos 1 minúscula", test: p => /[a-z]/.test(p) },
  { label: "Al menos 1 número", test: p => /[0-9]/.test(p) },
  { label: "Al menos 1 carácter especial", test: p => /[^A-Za-z0-9]/.test(p) },
];

const MENU = [
  { id: "venta_receso", label: "Venta Receso", roles: ["Administrador", "Cajero"] },
  { id: "venta_general", label: "Venta General", roles: ["Administrador", "Cajero"] },
  { id: "usuario", label: "Usuario", roles: ["Administrador"] },
  { id: "cliente", label: "Cliente", roles: ["Administrador"] },
  { id: "guisados", label: "Guisados", roles: ["Administrador"] },
  { id: "inventario", label: "Inventario", roles: ["Administrador"] },
  { id: "enviar_guisados", label: "Enviar Guisados", roles: ["Administrador"] },
  { id: "revisar_pedidos", label: "Revisar Pedidos", roles: ["Administrador"] },
  { id: "solicitar_ingredientes", label: "Solicitar Ingredientes", roles: ["Administrador"] },
  { id: "reportes", label: "Reportes", roles: ["Administrador"] },
];

let state = {
  usuario: null,
  seccion: null,
  usuarioSubvista: "menu",
  buscarResultados: [],
  seleccionado: null,
  navAbierto: true,
};

const app = document.getElementById("app");

function passwordChecklistHtml(password) {
  return `<div class="grid grid-cols-1 sm:grid-cols-2 gap-1 mb-3">
    ${PASSWORD_RULES.map(r => {
      const ok = r.test(password);
      return `<div class="flex items-center gap-1.5 text-xs" style="color:${ok ? "#3F7A5E" : "#6C7B8A"}">
        ${ok ? "✓" : "○"} ${r.label}
      </div>`;
    }).join("")}
  </div>`;
}

function render() {
  if (!state.usuario) return renderLogin();
  return renderApp();
}

function renderLogin() {
  app.innerHTML = `
    <div class="w-full min-h-screen flex items-center justify-center p-6" style="background:#1C2B3A">
      <div class="w-full max-w-sm p-7 rounded-2xl bg-white">
        <div class="flex flex-col items-center mb-6">
          <div class="w-12 h-12 rounded-full flex items-center justify-center mb-3" style="background:#F4F1EB">
            <span style="font-size:22px">☕</span>
          </div>
          <h1 class="jb-brand text-xl font-semibold" style="color:#1C2B3A">Cafetería Juan Bosco</h1>
          <p class="text-xs mt-1" style="color:#6C7B8A">Secundaria y Preparatoria</p>
        </div>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Usuario</label>
        <input id="loginInput" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5; color:#1C2B3A" autocapitalize="none" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Contraseña</label>
        <input id="passwordInput" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-4 outline-none border" style="border-color:#E1DED5; color:#1C2B3A" />
        <div id="loginError"></div>
        <button id="loginBtn" class="w-full py-2.5 rounded-lg text-sm font-bold" style="background:#1C2B3A; color:#F4F1EB">Iniciar sesión</button>
      </div>
    </div>`;

  const doLogin = async () => {
    const login = document.getElementById("loginInput").value;
    const password = document.getElementById("passwordInput").value;
    const errBox = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");
    if (!login || !password) return;
    errBox.innerHTML = "";
    btn.textContent = "Verificando…";
    btn.disabled = true;
    const { data, error } = await sb.rpc("login_usuario", { p_login: login, p_password: password });
    btn.textContent = "Iniciar sesión";
    btn.disabled = false;
    if (error) {
      errBox.innerHTML = `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${error.message}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      errBox.innerHTML = `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">Usuario o contraseña incorrectos.</div>`;
      return;
    }
    state.usuario = data[0];
    render();
  };

  document.getElementById("loginBtn").addEventListener("click", doLogin);
  document.getElementById("passwordInput").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

function renderApp() {
  const menuVisible = MENU.filter(m => m.roles.includes(state.usuario.puesto));
  app.innerHTML = `
    <div class="w-full min-h-screen flex flex-col">
      <header class="flex items-center justify-between px-5 py-3" style="background:#1C2B3A; color:#F4F1EB">
        <div class="flex items-center gap-3">
          <button id="menuToggle" class="w-8 h-8 flex items-center justify-center rounded-lg" style="background:#28394B">☰</button>
          <span style="color:#B8862E">☕</span>
          <span class="jb-brand text-base font-semibold">Cafetería Juan Bosco</span>
        </div>
        <div class="flex items-center gap-4">
          <div class="text-right hidden sm:block">
            <div class="text-sm font-semibold">Bienvenido, ${state.usuario.nom_usuario}</div>
            <div class="text-xs" style="color:#9CA9B6">${state.usuario.puesto}</div>
          </div>
          <div id="reloj" class="jb-mono text-xs px-2 py-1 rounded" style="background:#28394B"></div>
          <button id="logoutBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#B5453A; color:#fff">Cerrar sesión</button>
        </div>
      </header>
      <div class="flex flex-1 min-h-0">
        ${state.navAbierto ? `
        <nav id="nav" class="w-56 shrink-0 p-3 flex flex-col gap-1 bg-white" style="border-right:1px solid #E1DED5">
          ${menuVisible.map(m => `
            <button data-id="${m.id}" class="navbtn flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-left"
              style="background:${state.seccion === m.id ? "#1C2B3A" : "transparent"}; color:${state.seccion === m.id ? "#F4F1EB" : "#1C2B3A"}">
              ${m.label}
            </button>`).join("")}
        </nav>` : ""}
        <main id="main" class="flex-1 overflow-y-auto p-5"></main>
      </div>
    </div>`;

  document.getElementById("menuToggle").addEventListener("click", () => {
    state.navAbierto = !state.navAbierto;
    renderApp();
  });
  document.getElementById("logoutBtn").addEventListener("click", () => {
    state.usuario = null; state.seccion = null; render();
  });
  document.querySelectorAll(".navbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.seccion = btn.dataset.id;
      state.usuarioSubvista = "menu";
      state.navAbierto = false;
      renderApp();
    });
  });

  const reloj = document.getElementById("reloj");
  function tick() { reloj.textContent = new Date().toLocaleTimeString("es-MX"); }
  tick();
  window.__jbTimer && clearInterval(window.__jbTimer);
  window.__jbTimer = setInterval(tick, 1000);

  renderSeccion();
}

function renderSeccion() {
  const main = document.getElementById("main");
  if (!state.seccion) {
    main.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center" style="color:#6C7B8A">
      <p class="text-sm">Selecciona una opción del menú para comenzar.</p></div>`;
    return;
  }
  if (state.seccion === "usuario") return renderUsuario(main);
  if (state.seccion === "cliente") return renderCliente(main);
  if (state.seccion === "guisados") return renderGuisados(main);
  if (state.seccion === "inventario") return renderInventario(main);
  if (state.seccion === "enviar_guisados") return renderEnviarGuisados(main);
  if (state.seccion === "revisar_pedidos") return renderRevisarPedidos(main);
  if (state.seccion === "venta_receso") return renderVentaReceso(main);
  if (state.seccion === "venta_general") return renderVentaGeneral(main);
  if (state.seccion === "solicitar_ingredientes") return renderSolicitarIngredientes(main);
  const label = MENU.find(m => m.id === state.seccion)?.label;
  main.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center" style="color:#6C7B8A">
    <p class="text-sm font-semibold" style="color:#1C2B3A">${label}</p>
    <p class="text-xs mt-1">Este módulo todavía está en construcción.</p></div>`;
}

function renderUsuario(main) {
  let html = `<h2 class="text-lg font-bold mb-4" style="color:#1C2B3A">Usuario</h2>`;
  if (state.usuarioSubvista === "menu") {
    html += `<div class="flex gap-3 flex-wrap">
      <button class="usubtn flex flex-col items-center gap-2 px-6 py-5 rounded-xl w-32 bg-white border" data-v="alta" style="border-color:#E1DED5"><span style="font-size:22px">+</span><span class="text-sm font-semibold" style="color:#1C2B3A">Alta</span></button>
      <button class="usubtn flex flex-col items-center gap-2 px-6 py-5 rounded-xl w-32 bg-white border" data-v="baja" style="border-color:#E1DED5"><span style="font-size:22px">🗑</span><span class="text-sm font-semibold" style="color:#1C2B3A">Baja</span></button>
      <button class="usubtn flex flex-col items-center gap-2 px-6 py-5 rounded-xl w-32 bg-white border" data-v="modificar" style="border-color:#E1DED5"><span style="font-size:22px">✎</span><span class="text-sm font-semibold" style="color:#1C2B3A">Modificación</span></button>
    </div>`;
    main.innerHTML = html;
    document.querySelectorAll(".usubtn").forEach(b => b.addEventListener("click", () => { state.usuarioSubvista = b.dataset.v; renderSeccion(); }));
    return;
  }

  html += `<button id="volverUsuario" class="text-xs font-semibold mb-4" style="color:#B8862E">← Regresar al menú de Usuario</button>`;
  main.innerHTML = html + `<div id="usuarioContenido"></div>`;
  document.getElementById("volverUsuario").addEventListener("click", () => { state.usuarioSubvista = "menu"; renderSeccion(); });

  if (state.usuarioSubvista === "alta") renderUsuarioAlta();
  if (state.usuarioSubvista === "baja") renderUsuarioBaja();
  if (state.usuarioSubvista === "modificar") renderUsuarioModificar();
}

function renderUsuarioAlta() {
  const cont = document.getElementById("usuarioContenido");
  cont.innerHTML = `
    <div class="max-w-sm p-5 rounded-xl bg-white border" style="border-color:#E1DED5">
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nombre de usuario</label>
      <input id="altaNombre" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Puesto</label>
      <select id="altaPuesto" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
        <option value="Cajero">Cajero</option>
        <option value="Administrador">Administrador</option>
      </select>
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Login</label>
      <input id="altaLogin" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Contraseña</label>
      <input id="altaPassword" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
      <div id="altaChecklist"></div>
      <div id="altaMsg"></div>
      <div class="flex gap-2 mt-2">
        <button id="altaCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Cancelar</button>
        <button id="altaGuardar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1C2B3A; color:#F4F1EB">Guardar</button>
      </div>
    </div>`;

  const pwInput = document.getElementById("altaPassword");
  pwInput.addEventListener("input", () => {
    document.getElementById("altaChecklist").innerHTML = passwordChecklistHtml(pwInput.value);
  });
  document.getElementById("altaChecklist").innerHTML = passwordChecklistHtml("");

  document.getElementById("altaCancelar").addEventListener("click", () => { state.usuarioSubvista = "menu"; renderSeccion(); });

  document.getElementById("altaGuardar").addEventListener("click", async () => {
    const nom_usuario = document.getElementById("altaNombre").value;
    const puesto = document.getElementById("altaPuesto").value;
    const login = document.getElementById("altaLogin").value;
    const password = pwInput.value;
    const msg = document.getElementById("altaMsg");
    msg.innerHTML = "";
    if (!nom_usuario.trim() || !login.trim()) {
      msg.innerHTML = `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">Completa nombre y login.</div>`;
      return;
    }
    if (!PASSWORD_RULES.every(r => r.test(password))) {
      msg.innerHTML = `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">La contraseña no cumple los requisitos.</div>`;
      return;
    }
    const { error } = await sb.rpc("usuarios_alta", { p_nom_usuario: nom_usuario, p_puesto: puesto, p_login: login, p_password: password });
    if (error) {
      msg.innerHTML = `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${error.message}</div>`;
      return;
    }
    msg.innerHTML = `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">Usuario guardado correctamente.</div>`;
    document.getElementById("altaNombre").value = "";
    document.getElementById("altaLogin").value = "";
    pwInput.value = "";
    document.getElementById("altaChecklist").innerHTML = passwordChecklistHtml("");
  });
}

function renderBuscador(onSeleccionar) {
  return `
    <div class="max-w-md">
      <div class="flex items-center gap-2 px-3 py-2 rounded-lg mb-3 bg-white border" style="border-color:#E1DED5">
        <input id="buscarInput" placeholder="Buscar por nombre o login…" class="bg-transparent outline-none text-sm flex-1" style="color:#1C2B3A" />
      </div>
      <div id="buscarResultados" class="rounded-xl overflow-hidden border" style="border-color:#E1DED5"></div>
    </div>`;
}

function activarBuscador(onSeleccionar) {
  const input = document.getElementById("buscarInput");
  const cont = document.getElementById("buscarResultados");
  let timer = null;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const criterio = input.value.trim();
    if (!criterio) { cont.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const { data, error } = await sb.rpc("usuarios_buscar", { p_criterio: criterio });
      if (error) { cont.innerHTML = `<div class="p-3 text-xs" style="color:#B5453A">${error.message}</div>`; return; }
      cont.innerHTML = (data || []).map((u, i) => `
        <button class="resbtn w-full text-left px-4 py-2.5 text-sm bg-white" data-idx="${i}" style="${i > 0 ? 'border-top:1px solid #E1DED5' : ''}">
          <div style="color:#1C2B3A" class="font-medium">${u.nom_usuario}</div>
          <div style="color:#6C7B8A" class="text-xs">${u.login} · ${u.puesto}</div>
        </button>`).join("");
      const lista = data || [];
      cont.querySelectorAll(".resbtn").forEach(b => {
        b.addEventListener("click", () => onSeleccionar(lista[Number(b.dataset.idx)]));
      });
    }, 300);
  });
}

function renderUsuarioBaja() {
  const cont = document.getElementById("usuarioContenido");
  cont.innerHTML = renderBuscador() + `<div id="bajaMsg" class="mt-3"></div><div id="bajaModal"></div>`;
  activarBuscador((u) => {
    document.getElementById("bajaModal").innerHTML = `
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(28,43,58,0.5)" id="modalBg">
        <div class="rounded-xl p-5 bg-white w-72">
          <p class="text-sm mb-4" style="color:#1C2B3A">Confirme que desea eliminar del sistema al Usuario: <b>${u.nom_usuario}</b> (${u.login})</p>
          <div id="bajaModalMsg"></div>
          <div class="flex gap-2">
            <button id="bajaCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Cancelar</button>
            <button id="bajaConfirmar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#B5453A; color:#fff">Eliminar</button>
          </div>
        </div>
      </div>`;
    document.getElementById("bajaCancelar").addEventListener("click", () => { document.getElementById("bajaModal").innerHTML = ""; });
    document.getElementById("bajaConfirmar").addEventListener("click", async () => {
      const { error } = await sb.rpc("usuarios_eliminar", { p_id: u.id });
      const modalMsg = document.getElementById("bajaModalMsg");
      if (error) { modalMsg.innerHTML = `<div class="text-xs mb-2" style="color:#B5453A">${error.message}</div>`; return; }
      document.getElementById("bajaModal").innerHTML = "";
      document.getElementById("bajaMsg").innerHTML = `<p class="text-xs" style="color:#3F7A5E">✓ Usuario eliminado correctamente.</p>`;
    });
  });
}

function renderUsuarioModificar() {
  const cont = document.getElementById("usuarioContenido");
  cont.innerHTML = renderBuscador() + `<div id="modForm"></div>`;
  activarBuscador((u) => {
    document.getElementById("modForm").innerHTML = `
      <div class="max-w-sm p-5 rounded-xl mt-4 bg-white border" style="border-color:#E1DED5">
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Login (no editable)</label>
        <input value="${u.login}" disabled class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5; color:#6C7B8A; background:#F4F1EB" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nombre de usuario</label>
        <input id="modNombre" value="${u.nom_usuario}" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Puesto</label>
        <select id="modPuesto" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
          <option value="Cajero" ${u.puesto === "Cajero" ? "selected" : ""}>Cajero</option>
          <option value="Administrador" ${u.puesto === "Administrador" ? "selected" : ""}>Administrador</option>
        </select>
        <div id="modMsg"></div>
        <button id="modGuardar" class="w-full py-2 rounded-lg text-sm font-bold" style="background:#1C2B3A; color:#F4F1EB">Guardar datos</button>
      </div>

      <div class="max-w-sm p-5 rounded-xl mt-4 bg-white border" style="border-color:#E1DED5">
        <p class="text-xs font-semibold mb-3" style="color:#6C7B8A">Cambiar contraseña (independiente de los datos de arriba)</p>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nueva contraseña</label>
        <input id="modPassword" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
        <div id="modPassChecklist"></div>
        <div id="modPassMsg"></div>
        <button id="modPassGuardar" class="w-full py-2 rounded-lg text-sm font-bold" style="background:#B8862E; color:#fff">Cambiar contraseña</button>
      </div>`;

    document.getElementById("modGuardar").addEventListener("click", async () => {
      const nom_usuario = document.getElementById("modNombre").value;
      const puesto = document.getElementById("modPuesto").value;
      const msg = document.getElementById("modMsg");
      msg.innerHTML = "";
      const { error } = await sb.rpc("usuarios_modificar", { p_id: u.id, p_nom_usuario: nom_usuario, p_puesto: puesto, p_password: null });
      if (error) {
        msg.innerHTML = `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${error.message}</div>`;
        return;
      }
      u.nom_usuario = nom_usuario;
      u.puesto = puesto;
      msg.innerHTML = `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">Datos guardados correctamente.</div>`;
    });

    const pw = document.getElementById("modPassword");
    pw.addEventListener("input", () => {
      document.getElementById("modPassChecklist").innerHTML = pw.value ? passwordChecklistHtml(pw.value) : "";
    });

    document.getElementById("modPassGuardar").addEventListener("click", async () => {
      const password = pw.value;
      const msg = document.getElementById("modPassMsg");
      msg.innerHTML = "";
      if (!password || !PASSWORD_RULES.every(r => r.test(password))) {

function errBox(texto) {

function okBox(texto) {
  return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">${texto}</div>`;
}

function cargarScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error("No se pudo cargar " + src));
    document.head.appendChild(s);
  });
}

async function asegurarQRCode() {
  if (typeof QRCode !== "undefined") return;
  const fuentesRespaldo = [
    "https://unpkg.com/qrcode@1.4.4/build/qrcode.min.js",
    "https://cdn.jsdelivr.net/npm/qrcode@1.5.0/build/qrcode.min.js",
  ];
  for (const src of fuentesRespaldo) {
    try {
      await cargarScript(src);
      if (typeof QRCode !== "undefined") return;
    } catch (e) { /* probar la siguiente fuente */ }
  }
  throw new Error("No se pudo cargar la librería de códigos QR desde ninguna fuente. Revisa tu conexión a internet.");
}

function qrToCanvas(canvas, texto, opciones) {
  return new Promise(async (resolve, reject) => {
    try {
      await asegurarQRCode();
    } catch (e) { return reject(e); }
    QRCode.toCanvas(canvas, texto, opciones, (err) => {
      if (err) reject(err); else resolve();
    });
  });
}

function qrToDataUrl(texto, opciones) {
  return new Promise(async (resolve, reject) => {
    try {
      await asegurarQRCode();
    } catch (e) { return reject(e); }
    QRCode.toDataURL(texto, opciones, (err, url) => {
      if (err) reject(err); else resolve(url);
    });
  });
}

async function mostrarPreviewGafete(contenedor, cliente) {
  contenedor.innerHTML = `<div class="flex flex-col items-center gap-2 p-3 rounded-lg mb-2" style="background:#F4F1EB">
    <canvas id="qrPreview"></canvas>
    <div id="qrPreviewMsg" class="text-xs" style="color:#B5453A"></div>
    <div class="text-sm font-semibold" style="color:#1C2B3A">${cliente.nombre_cliente}</div>
    <div class="text-xs jb-mono" style="color:#6C7B8A">${cliente.id_cliente}</div>
    <button id="btnImprimirUno" class="mt-1 px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#B8862E; color:#fff">Descargar gafete (PDF)</button>
  </div>`;
  document.getElementById("btnImprimirUno").addEventListener("click", () => generarPdfGafetes([cliente]));
  if (!cliente.qr_token) {
    document.getElementById("qrPreviewMsg").textContent = "Diagnóstico: el cliente llegó sin qr_token. Datos recibidos: " + JSON.stringify(cliente);
    return;
  }
  try {
    await qrToCanvas(document.getElementById("qrPreview"), cliente.qr_token, { width: 140, margin: 1 });
  } catch (err) {
    document.getElementById("qrPreviewMsg").textContent = "No se pudo dibujar la vista previa del QR: " + err.message;
  }
}

async function generarPdfGafetes(clientes) {
  try {
    const { jsPDF } = window.jspdf;
    const ANCHO = 70;
    const ALTO = 100;
    const doc = new jsPDF({ unit: "mm", format: [ANCHO, ALTO] });
    const cx = ANCHO / 2;

    for (let i = 0; i < clientes.length; i++) {
      const c = clientes[i];
      if (i > 0) doc.addPage([ANCHO, ALTO]);

      const qrDataUrl = await qrToDataUrl(c.qr_token, { width: 300, margin: 1 });
      const qrTam = 40;
      doc.addImage(qrDataUrl, "PNG", cx - qrTam / 2, 15, qrTam, qrTam);

      let y = 15 + qrTam + 12;

      doc.setFont(undefined, "normal");
      doc.setFontSize(11);
      doc.text(c.id_cliente, cx, y, { align: "center" });
      y += 9;

      doc.setFont(undefined, "bold");
      doc.setFontSize(14);
      const lineasNombre = doc.splitTextToSize(c.nombre_cliente, ANCHO - 10);
      doc.text(lineasNombre, cx, y, { align: "center" });
      y += lineasNombre.length * 6 + 7;

      doc.setFont(undefined, "normal");
      doc.setFontSize(10);
      doc.text(c.nivel_cliente, cx, y, { align: "center" });
    }
    doc.save(clientes.length === 1 ? `gafete-${clientes[0].id_cliente}.pdf` : `gafetes-${Date.now()}.pdf`);
  } catch (err) {
    alert("No se pudo generar el PDF: " + err.message);
  }
}

function activarClienteBuscador(renderFila) {
  const input = document.getElementById("cBuscarInput");
  const cont = document.getElementById("cBuscarResultados");
  let timer = null;
  let onFilaClick = () => {};
  let onListaActualizada = () => {};
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const criterio = input.value.trim();
    if (!criterio) { cont.innerHTML = ""; onListaActualizada([]); return; }
    timer = setTimeout(async () => {
      const { data, error } = await sb.rpc("clientes_buscar", { p_criterio: criterio });

  });
  return {
    setOnFilaClick: (fn) => { onFilaClick = fn; },
    setOnListaActualizada: (fn) => { onListaActualizada = fn; },
  };
}

function renderBuscadorGenerico(placeholder) {
  return `
    <div class="max-w-md">
      <div class="flex items-center gap-2 px-3 py-2 rounded-lg mb-3 bg-white border" style="border-color:#E1DED5">
        <input id="gBuscarInput" placeholder="${placeholder}" class="bg-transparent outline-none text-sm flex-1" style="color:#1C2B3A" />
      </div>
      <div id="gBuscarResultados" class="rounded-xl overflow-hidden border" style="border-color:#E1DED5"></div>
    </div>`;
}

function activarBuscadorGenerico(rpcName, renderFila) {
  const input = document.getElementById("gBuscarInput");
  const cont = document.getElementById("gBuscarResultados");
  let timer = null;
  let onFilaClick = () => {};
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const criterio = input.value.trim();
    if (!criterio) { cont.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const { data, error } = await sb.rpc(rpcName, { p_criterio: criterio });
      if (error) { cont.innerHTML = `<div class="p-3 text-xs" style="color:#B5453A">${error.message}</div>`; return; }
      const lista = data || [];
      cont.innerHTML = lista.map((r, i) => renderFila(r, i)).join("");
      lista.forEach((r, i) => {
        const row = cont.querySelector(`[data-idx="${i}"]`);
        if (row) row.addEventListener("click", () => onFilaClick(r));
      });
    }, 300);
  });
  return { setOnFilaClick: (fn) => { onFilaClick = fn; } };
}

function renderRecetaEditor(cont, guisadoId) {
  cont.innerHTML = `

        <input id="recCantidad" type="number" step="0.001" placeholder="Cant." class="w-20 px-2 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
        <select id="recUnidad" class="px-2 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">

    </div>`;

  async function cargarLista() {
    const { data } = await sb.rpc("receta_ingredientes_obtener", { p_guisado_id: guisadoId });
    const lista = data || [];
    const listaEl = document.getElementById("recetaLista");
    listaEl.innerHTML = lista.length === 0
      ? `<p class="text-xs" style="color:#6C7B8A">Sin ingredientes todavía.</p>`
      : lista.map(i => `
        <div class="flex items-center justify-between text-sm py-1" style="border-bottom:1px solid #E1DED5">
          <span style="color:#1C2B3A">${i.ingrediente} — ${i.cantidad} ${i.unidad}</span>
          <button class="recDel text-xs" data-id="${i.id}" style="color:#B5453A">Quitar</button>
        </div>`).join("");
    listaEl.querySelectorAll(".recDel").forEach(b => {
      b.addEventListener("click", async () => {
        await sb.rpc("receta_ingrediente_eliminar", { p_id: b.dataset.id });
        cargarLista();
      });
    });
  }

  document.getElementById("recAgregar").addEventListener("click", async () => {
    const ingrediente = document.getElementById("recIngrediente").value;
    const cantidad = Number(document.getElementById("recCantidad").value);
    const unidad = document.getElementById("recUnidad").value;
    const msg = document.getElementById("recMsg");
    msg.innerHTML = "";
    if (!ingrediente.trim() || !cantidad || cantidad <= 0) return msg.innerHTML = errBox("Escribe el ingrediente y una cantidad válida.");
    const { error } = await sb.rpc("receta_ingrediente_agregar", { p_guisado_id: guisadoId, p_ingrediente: ingrediente, p_cantidad: cantidad, p_unidad: unidad });
    if (error) return msg.innerHTML = errBox(error.message);
    document.getElementById("recIngrediente").value = "";
    document.getElementById("recCantidad").value = "";
    cargarLista();
  });

  cargarLista();
}

let vrStreamActivo = null;

function detenerCamaraVR() {
  if (vrStreamActivo) {
    vrStreamActivo.getTracks().forEach(t => t.stop());
    vrStreamActivo = null;
  }
}

function renderVentaReceso(main) {
  detenerCamaraVR();
  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1C2B3A">Venta Receso</h2>
    <div class="max-w-md">
      <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-2" style="color:#1C2B3A">Escanear gafete (QR)</p>
        <video id="vrVideo" class="w-full rounded-lg bg-black" style="max-height:260px; object-fit:cover" playsinline muted></video>
        <canvas id="vrCanvas" style="display:none"></canvas>
        <button id="vrIniciar" class="w-full mt-2 py-2 rounded-lg text-sm font-semibold" style="background:#1C2B3A; color:#F4F1EB">Activar cámara</button>
        <p id="vrCamMsg" class="text-xs mt-2" style="color:#B5453A"></p>
      </div>

      <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-2" style="color:#1C2B3A">O buscar manualmente</p>
        <div class="flex gap-2">
          <input id="vrBuscarInput" placeholder="Nombre o folio del alumno…" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          <button id="vrBuscarBtn" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Buscar</button>
        </div>
        <div id="vrResultadosBusqueda" class="mt-2"></div>
      </div>

      <div id="vrResultado"></div>
    </div>`;

  document.getElementById("vrIniciar").addEventListener("click", iniciarCamara);
  document.getElementById("vrBuscarBtn").addEventListener("click", buscarManual);
  document.getElementById("vrBuscarInput").addEventListener("keydown", (e) => { if (e.key === "Enter") buscarManual(); });

  async function iniciarCamara() {
    const msg = document.getElementById("vrCamMsg");
    msg.textContent = "";
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      vrStreamActivo = stream;
      const video = document.getElementById("vrVideo");
      video.srcObject = stream;
      await video.play();
      requestAnimationFrame(escanearCuadro);
    } catch (err) {
      msg.textContent = "No se pudo activar la cámara: " + err.message + ". Usa la búsqueda manual de abajo.";
    }
  }

  function escanearCuadro() {
    if (!vrStreamActivo) return;
    const video = document.getElementById("vrVideo");
    const canvas = document.getElementById("vrCanvas");
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const codigo = jsQR(imageData.data, imageData.width, imageData.height);
      if (codigo && codigo.data) {
        detenerCamaraVR();
        procesarToken(codigo.data);
        return;
      }
    }
    requestAnimationFrame(escanearCuadro);
  }

  async function buscarManual() {
    const criterio = document.getElementById("vrBuscarInput").value.trim();
    const cont = document.getElementById("vrResultadosBusqueda");
    if (!criterio) { cont.innerHTML = ""; return; }
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Buscando…</p>`;
    const { data, error } = await sb.rpc("venta_receso_buscar", { p_criterio: criterio });
    if (error) { cont.innerHTML = errBox(error.message); return; }
    const lista = data || [];
    cont.innerHTML = lista.length === 0
      ? `<p class="text-xs" style="color:#6C7B8A">Sin resultados.</p>`
      : lista.map((r, i) => `
        <button class="vrResBtn w-full text-left px-3 py-2 rounded-lg text-sm bg-white border mb-1" data-idx="${i}" style="border-color:#E1DED5; color:#1C2B3A">
          ${r.nombre_cliente} <span class="text-xs jb-mono" style="color:#6C7B8A">(${r.id_cliente})</span>
        </button>`).join("");
    cont.querySelectorAll(".vrResBtn").forEach(b => b.addEventListener("click", () => mostrarResultado(lista[Number(b.dataset.idx)])));
  }

  async function procesarToken(token) {
    const { data, error } = await sb.rpc("venta_receso_por_qr", { p_qr_token: token });
    if (error) { document.getElementById("vrResultado").innerHTML = errBox(error.message); return; }
    if (!data || !data[0]) { document.getElementById("vrResultado").innerHTML = errBox("QR no reconocido."); return; }
    mostrarResultado(data[0]);
  }

  function mostrarResultado(r) {
    const cont = document.getElementById("vrResultado");
    if (!r.pedido_id) {
      cont.innerHTML = `
        <div class="p-4 rounded-xl mt-3" style="background:#F5E4E1; border:1px solid #B5453A">
          <p class="text-sm font-semibold" style="color:#1C2B3A">${r.nombre_cliente}</p>
          <p class="text-xs mt-1" style="color:#B5453A">No tiene un pedido capturado para hoy.</p>
        </div>`;
      return;
    }
    cont.innerHTML = `<p class="text-xs mt-3" style="color:#6C7B8A">Cargando nota…</p>`;
    cargarNota(r);
  }

  async function cargarNota(r) {
    const cont = document.getElementById("vrResultado");

    const [notaRes, compRes, aguaRes] = await Promise.all([
      sb.rpc("venta_receso_nota_obtener", { p_pedido_id: r.pedido_id }),
      r.guisado_id && r.menu_dia_id
        ? sb.rpc("venta_receso_complementos_disponibles", { p_menu_dia_id: r.menu_dia_id, p_guisado_id: r.guisado_id })
        : { data: [] },
      r.menu_dia_id
        ? sb.rpc("venta_receso_aguas_disponibles", { p_menu_dia_id: r.menu_dia_id })
        : { data: [] },
    ]);

    if (notaRes.error) { cont.innerHTML = errBox(notaRes.error.message); return; }

    const nota = notaRes.data || [];
    const complementosDisp = compRes.data || [];
    const aguasDisp = aguaRes.data || [];
    const yaSurtido = r.estado_pedido === "Surtido";
    let extrasCaja = []; // { tipo, referencia_id, descripcion, cantidad, precio_unitario }

    function agregarACaja(item) {
      const existente = extrasCaja.find(e => e.tipo === item.tipo && e.referencia_id === item.referencia_id);
      if (existente) {
        existente.cantidad += item.cantidad;
      } else {
        extrasCaja.push(item);
      }
    }

    const totalPreorden = () => nota.reduce((s, l) => s + Number(l.importe), 0);
    const totalExtras = () => extrasCaja.reduce((s, l) => s + (l.cantidad * l.precio_unitario), 0);
    const totalGeneral = () => totalPreorden() + totalExtras();

    function pintar() {
      cont.innerHTML = `
        <div class="p-4 rounded-xl mt-3 bg-white border" style="border-color:#E1DED5">
          <p class="text-base font-bold mb-2" style="color:#1C2B3A">${r.nombre_cliente}</p>

          <table class="w-full text-sm mb-1">
            <thead>
              <tr class="text-xs" style="color:#6C7B8A">
                <th class="text-left font-semibold pb-1">Cant.</th>
                <th class="text-left font-semibold pb-1">Producto</th>
                <th class="text-right font-semibold pb-1">Importe</th>
              </tr>
            </thead>
            <tbody>
              ${nota.map(l => `
                <tr style="color:#1C2B3A">
                  <td class="py-0.5">${l.cantidad}</td>
                  <td class="py-0.5">${l.concepto}</td>
                  <td class="py-0.5 text-right">$${Number(l.importe).toFixed(2)}</td>
                </tr>`).join("")}
            </tbody>
          </table>

          ${extrasCaja.length > 0 ? `
            <p class="text-xs font-semibold mt-3 mb-1" style="color:#B8862E">Agregado en caja</p>
            <table class="w-full text-sm mb-1">
              <tbody>
                ${extrasCaja.map((l, i) => `
                  <tr style="color:#1C2B3A">
                    <td class="py-0.5"><input type="number" min="1" value="${l.cantidad}" data-i="${i}" class="vrCajaQty w-14 px-1 py-0.5 rounded text-xs border" style="border-color:#E1DED5" /></td>
                    <td class="py-0.5">${l.descripcion}</td>
                    <td class="py-0.5 text-right">$${(l.cantidad * l.precio_unitario).toFixed(2)}</td>
                    <td class="py-0.5 text-right"><button data-i="${i}" class="vrQuitarBtn text-xs px-1" style="color:#B5453A">✕</button></td>
                  </tr>`).join("")}
              </tbody>
            </table>` : ""}

          <div class="flex justify-between text-sm font-bold border-t pt-2 mt-2" style="border-color:#E1DED5; color:#1C2B3A">
            <span>Total</span><span>$${totalGeneral().toFixed(2)}</span>
          </div>

          ${!yaSurtido ? `
            <div class="mt-4 p-3 rounded-lg" style="background:#F4F1EB">
              <p class="text-xs font-semibold mb-2" style="color:#6C7B8A">Agregar a la venta</p>

              <div class="flex gap-2 mb-2">
                <input id="vrProdInput" placeholder="Buscar producto (bebida, botana…)" class="flex-1 px-2 py-1.5 rounded-lg text-xs outline-none border" style="border-color:#E1DED5" />
                <button id="vrProdBuscarBtn" class="px-2 py-1.5 rounded-lg text-xs font-semibold" style="background:#fff; border:1px solid #E1DED5; color:#1C2B3A">Buscar</button>
              </div>
              <div id="vrProdResultados" class="mb-2"></div>

              ${r.guisado_id ? `
              <div class="flex items-center gap-2 mb-2">
                <span class="text-xs flex-1" style="color:#1C2B3A">Porción extra de guisado ($${Number(r.costo_porcion_extra || 0).toFixed(2)} c/u)</span>
                <input id="vrGuisadoQty" type="number" min="1" value="1" class="w-14 px-1 py-1 rounded text-xs border" style="border-color:#E1DED5" />
                <button id="vrGuisadoAddBtn" class="px-2 py-1 rounded text-xs font-semibold" style="background:#1C2B3A; color:#fff">+</button>
              </div>` : ""}

              ${complementosDisp.length > 0 ? `
              <div class="flex items-center gap-2 mb-2">
                <select id="vrCompSel" class="flex-1 px-2 py-1.5 rounded-lg text-xs outline-none border" style="border-color:#E1DED5">
                  ${complementosDisp.map(c => `<option value="${c.id}">${c.nombre_complemento} ($${Number(c.costo_complemento).toFixed(2)})</option>`).join("")}
                </select>
                <input id="vrCompQty" type="number" min="1" value="1" class="w-14 px-1 py-1 rounded text-xs border" style="border-color:#E1DED5" />
                <button id="vrCompAddBtn" class="px-2 py-1 rounded text-xs font-semibold" style="background:#1C2B3A; color:#fff">+</button>
              </div>` : ""}

              ${aguasDisp.length > 0 ? `
              <div class="flex items-center gap-2 mb-2">
                <select id="vrAguaSel" class="flex-1 px-2 py-1.5 rounded-lg text-xs outline-none border" style="border-color:#E1DED5">
                  ${aguasDisp.map(a => `<option value="${a.id}">${a.nombre_producto} extra ($${Number(a.costo_producto).toFixed(2)})</option>`).join("")}
                </select>
                <input id="vrAguaQty" type="number" min="1" value="1" class="w-14 px-1 py-1 rounded text-xs border" style="border-color:#E1DED5" />
                <button id="vrAguaAddBtn" class="px-2 py-1 rounded text-xs font-semibold" style="background:#1C2B3A; color:#fff">+</button>
              </div>` : ""}
            </div>
            <div id="vrAccionMsg" class="mt-2"></div>
            <button id="vrCerrarVentaBtn" class="w-full mt-3 py-2.5 rounded-lg text-sm font-bold" style="background:#3F7A5E; color:#fff">Cerrar venta</button>
          ` : `<div class="mt-3 text-xs p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">Este pedido YA fue entregado anteriormente.</div>`}

          <button id="vrOtro" class="w-full mt-2 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Escanear otro / buscar otro</button>
        </div>
        <div id="vrModal"></div>`;

      document.getElementById("vrOtro").addEventListener("click", () => renderVentaReceso(document.getElementById("main")));

      cont.querySelectorAll(".vrQuitarBtn").forEach(b => b.addEventListener("click", () => {
        extrasCaja.splice(Number(b.dataset.i), 1);
        pintar();
      }));

      cont.querySelectorAll(".vrCajaQty").forEach(inp => inp.addEventListener("change", () => {
        const i = Number(inp.dataset.i);
        const qty = Math.max(1, Number(inp.value) || 1);
        extrasCaja[i].cantidad = qty;
        pintar();
      }));

      if (!yaSurtido) {
        document.getElementById("vrProdBuscarBtn").addEventListener("click", buscarProducto);
        document.getElementById("vrProdInput").addEventListener("keydown", e => { if (e.key === "Enter") buscarProducto(); });

        const guisadoBtn = document.getElementById("vrGuisadoAddBtn");
        if (guisadoBtn) guisadoBtn.addEventListener("click", () => {
          const qty = Math.max(1, Number(document.getElementById("vrGuisadoQty").value) || 1);
          agregarACaja({ tipo: "Guisado", referencia_id: r.guisado_id, descripcion: "Extra: porción de guisado", cantidad: qty, precio_unitario: Number(r.costo_porcion_extra || 0) });
          pintar();
        });

        const compBtn = document.getElementById("vrCompAddBtn");
        if (compBtn) compBtn.addEventListener("click", () => {
          const id = document.getElementById("vrCompSel").value;
          const qty = Math.max(1, Number(document.getElementById("vrCompQty").value) || 1);
          const comp = complementosDisp.find(c => c.id === id);
          agregarACaja({ tipo: "Complemento", referencia_id: id, descripcion: "Extra: " + comp.nombre_complemento, cantidad: qty, precio_unitario: Number(comp.costo_complemento) });
          pintar();
        });

        const aguaBtn = document.getElementById("vrAguaAddBtn");
        if (aguaBtn) aguaBtn.addEventListener("click", () => {
          const id = document.getElementById("vrAguaSel").value;
          const qty = Math.max(1, Number(document.getElementById("vrAguaQty").value) || 1);
          const agua = aguasDisp.find(a => a.id === id);
          agregarACaja({ tipo: "Agua", referencia_id: id, descripcion: "Extra: " + agua.nombre_producto, cantidad: qty, precio_unitario: Number(agua.costo_producto) });
          pintar();
        });

        document.getElementById("vrCerrarVentaBtn").addEventListener("click", abrirModalCobro);
      }
    }

    async function buscarProducto() {
      const criterio = document.getElementById("vrProdInput").value.trim();
      const cajaResultados = document.getElementById("vrProdResultados");
      if (!criterio) { cajaResultados.innerHTML = ""; return; }
      cajaResultados.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Buscando…</p>`;
      const { data, error } = await sb.rpc("productos_buscar", { p_criterio: criterio });
      if (error) { cajaResultados.innerHTML = errBox(error.message); return; }
      const lista = (data || []).filter(p => p.activo);
      cajaResultados.innerHTML = lista.length === 0
        ? `<p class="text-xs" style="color:#6C7B8A">Sin resultados.</p>`
        : lista.map((p, i) => `
          <div class="flex items-center gap-2 mb-1">
            <span class="flex-1 text-xs" style="color:#1C2B3A">${p.nombre_producto} ($${Number(p.costo_producto).toFixed(2)}) · Stock: ${p.stock}</span>
            <input type="number" min="1" value="1" class="vrProdQty w-14 px-1 py-1 rounded text-xs border" data-idx="${i}" style="border-color:#E1DED5" />
            <button class="vrProdAddBtn px-2 py-1 rounded text-xs font-semibold" data-idx="${i}" style="background:#1C2B3A; color:#fff">+</button>
          </div>`).join("");
      cajaResultados.querySelectorAll(".vrProdAddBtn").forEach(b => b.addEventListener("click", () => {
        const idx = Number(b.dataset.idx);
        const qtyInput = cajaResultados.querySelector(`.vrProdQty[data-idx="${idx}"]`);
        const qty = Math.max(1, Number(qtyInput.value) || 1);
        const p = lista[idx];
        agregarACaja({ tipo: "Producto", referencia_id: p.id, descripcion: p.nombre_producto, cantidad: qty, precio_unitario: Number(p.costo_producto) });
        pintar();
      }));
    }

    function abrirModalCobro() {
      const total = totalGeneral();
      const modal = document.getElementById("vrModal");
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(28,43,58,0.5)">
          <div class="rounded-xl p-5 bg-white w-80">
            <p class="text-sm font-semibold mb-1" style="color:#1C2B3A">Cerrar venta</p>
            <p class="text-sm mb-3" style="color:#6C7B8A">Total a cobrar: <span class="font-bold" style="color:#1C2B3A">$${total.toFixed(2)}</span></p>
            <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Cantidad recibida</label>
            <input id="vrMontoRecibido" type="number" step="0.01" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
            <div id="vrCambioTxt" class="text-sm mb-3"></div>
            <div id="vrModalMsg"></div>
            <div class="flex gap-2">
              <button id="vrModalCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Cancelar</button>
              <button id="vrModalConfirmar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#3F7A5E; color:#fff">Confirmar venta</button>
            </div>
          </div>
        </div>`;

      const montoInput = document.getElementById("vrMontoRecibido");
      const cambioTxt = document.getElementById("vrCambioTxt");
      montoInput.addEventListener("input", () => {
        const recibido = Number(montoInput.value) || 0;
        if (recibido >= total) {
          cambioTxt.style.color = "#3F7A5E";
          cambioTxt.textContent = `Cambio: $${(recibido - total).toFixed(2)}`;
        } else {
          cambioTxt.style.color = "#B5453A";
          cambioTxt.textContent = `Falta: $${(total - recibido).toFixed(2)}`;
        }
      });

      document.getElementById("vrModalCancelar").addEventListener("click", () => { modal.innerHTML = ""; });

      document.getElementById("vrModalConfirmar").addEventListener("click", async () => {
        const recibido = Number(montoInput.value) || 0;
        const msg = document.getElementById("vrModalMsg");
        msg.innerHTML = "";
        if (recibido < total) { msg.innerHTML = errBox("La cantidad recibida debe ser igual o mayor al total."); return; }

        const reg_complementos = extrasCaja.filter(e => e.tipo === "Complemento").map(e => ({ complemento_id: e.referencia_id, cantidad: e.cantidad }));
        const reg_productos = extrasCaja.filter(e => e.tipo === "Producto").map(e => ({ producto_id: e.referencia_id, cantidad: e.cantidad }));
        const guisadoExtraQty = extrasCaja.filter(e => e.tipo === "Guisado").reduce((s, e) => s + e.cantidad, 0);
        const aguaExtra = extrasCaja.find(e => e.tipo === "Agua");

        const { data, error } = await sb.rpc("venta_receso_cerrar_venta", {
          p_pedido_id: r.pedido_id,
          p_cajero_id: state.usuario.id,
          p_monto_recibido: recibido,
          p_reg_guisado_cantidad: guisadoExtraQty,
          p_reg_complementos: reg_complementos,
          p_reg_agua_producto_id: aguaExtra ? aguaExtra.referencia_id : null,
          p_reg_agua_cantidad: aguaExtra ? aguaExtra.cantidad : 0,
          p_reg_productos: reg_productos,
        });
        if (error) { msg.innerHTML = errBox(error.message); return; }

        modal.innerHTML = `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(28,43,58,0.5)">
            <div class="rounded-xl p-5 bg-white w-80 text-center">
              <p class="text-sm font-bold mb-2" style="color:#3F7A5E">✓ Venta cerrada</p>
              <p class="text-xs mb-1" style="color:#1C2B3A">Folio ${data[0].folio_venta}</p>
              <p class="text-xs mb-1" style="color:#1C2B3A">Total: $${Number(data[0].total).toFixed(2)}</p>
              <p class="text-xs" style="color:#1C2B3A">Cambio: $${Number(data[0].cambio).toFixed(2)}</p>
            </div>
          </div>`;
        setTimeout(() => renderVentaReceso(document.getElementById("main")), 1800);
      });
    }

    pintar();
  }
}

function renderVentaGeneral(main) {
  let carrito = []; // { producto_id, nombre_producto, cantidad, precio_unitario, stock }

  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1C2B3A">Venta General</h2>
    <div class="max-w-md">
      <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-2" style="color:#1C2B3A">Buscar producto</p>
        <div class="flex gap-2">
          <input id="vgBuscarInput" placeholder="Nombre o categoría del producto…" class="flex-1 px-3 py-2 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          <button id="vgBuscarBtn" class="px-3 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Buscar</button>
        </div>
        <div id="vgResultados" class="mt-2"></div>
      </div>

      <div id="vgNota"></div>
    </div>`;

  document.getElementById("vgBuscarBtn").addEventListener("click", buscarProducto);
  document.getElementById("vgBuscarInput").addEventListener("keydown", e => { if (e.key === "Enter") buscarProducto(); });

  function agregarAlCarrito(item) {
    const existente = carrito.find(l => l.producto_id === item.producto_id);
    if (existente) {
      existente.cantidad += item.cantidad;
    } else {
      carrito.push(item);
    }
  }

  async function buscarProducto() {
    const criterio = document.getElementById("vgBuscarInput").value.trim();
    const cont = document.getElementById("vgResultados");
    if (!criterio) { cont.innerHTML = ""; return; }
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Buscando…</p>`;
    const { data, error } = await sb.rpc("productos_buscar", { p_criterio: criterio });
    if (error) { cont.innerHTML = errBox(error.message); return; }
    const lista = (data || []).filter(p => p.activo);
    cont.innerHTML = lista.length === 0
      ? `<p class="text-xs" style="color:#6C7B8A">Sin resultados.</p>`
      : lista.map((p, i) => `
        <div class="flex items-center gap-2 mb-1">
          <span class="flex-1 text-xs" style="color:#1C2B3A">${p.nombre_producto} ($${Number(p.costo_producto).toFixed(2)}) · Stock: ${p.stock}</span>
          <input type="number" min="1" value="1" class="vgQty w-14 px-1 py-1 rounded text-xs border" data-idx="${i}" style="border-color:#E1DED5" />
          <button class="vgAddBtn px-2 py-1 rounded text-xs font-semibold" data-idx="${i}" style="background:#1C2B3A; color:#fff">+</button>
        </div>`).join("");
    cont.querySelectorAll(".vgAddBtn").forEach(b => b.addEventListener("click", () => {
      const idx = Number(b.dataset.idx);
      const qtyInput = cont.querySelector(`.vgQty[data-idx="${idx}"]`);
      const qty = Math.max(1, Number(qtyInput.value) || 1);
      const p = lista[idx];
      agregarAlCarrito({ producto_id: p.id, nombre_producto: p.nombre_producto, cantidad: qty, precio_unitario: Number(p.costo_producto) });
      pintarNota();
    }));
  }

  function totalGeneral() {
    return carrito.reduce((s, l) => s + (l.cantidad * l.precio_unitario), 0);
  }

  function pintarNota() {
    const cont = document.getElementById("vgNota");
    if (carrito.length === 0) { cont.innerHTML = ""; return; }

    cont.innerHTML = `
      <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
        <table class="w-full text-sm mb-1">
          <thead>
            <tr class="text-xs" style="color:#6C7B8A">
              <th class="text-left font-semibold pb-1">Cant.</th>
              <th class="text-left font-semibold pb-1">Producto</th>
              <th class="text-right font-semibold pb-1">Importe</th>
            </tr>
          </thead>
          <tbody>
            ${carrito.map((l, i) => `
              <tr style="color:#1C2B3A">
                <td class="py-0.5"><input type="number" min="1" value="${l.cantidad}" data-i="${i}" class="vgCarritoQty w-14 px-1 py-0.5 rounded text-xs border" style="border-color:#E1DED5" /></td>
                <td class="py-0.5">${l.nombre_producto}</td>
                <td class="py-0.5 text-right">$${(l.cantidad * l.precio_unitario).toFixed(2)}</td>
                <td class="py-0.5 text-right"><button data-i="${i}" class="vgQuitarBtn text-xs px-1" style="color:#B5453A">✕</button></td>
              </tr>`).join("")}
          </tbody>
        </table>
        <div class="flex justify-between text-sm font-bold border-t pt-2 mt-2" style="border-color:#E1DED5; color:#1C2B3A">
          <span>Total</span><span>$${totalGeneral().toFixed(2)}</span>
        </div>
        <button id="vgCerrarVentaBtn" class="w-full mt-3 py-2.5 rounded-lg text-sm font-bold" style="background:#3F7A5E; color:#fff">Cerrar venta</button>
      </div>
      <div id="vgModal"></div>`;

    cont.querySelectorAll(".vgQuitarBtn").forEach(b => b.addEventListener("click", () => {
      carrito.splice(Number(b.dataset.i), 1);
      pintarNota();
    }));

    cont.querySelectorAll(".vgCarritoQty").forEach(inp => inp.addEventListener("change", () => {
      const i = Number(inp.dataset.i);
      const qty = Math.max(1, Number(inp.value) || 1);
      carrito[i].cantidad = qty;
      pintarNota();
    }));

    document.getElementById("vgCerrarVentaBtn").addEventListener("click", abrirModalCobro);
  }

  function abrirModalCobro() {
    const total = totalGeneral();
    const modal = document.getElementById("vgModal");
    modal.innerHTML = `
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(28,43,58,0.5)">
        <div class="rounded-xl p-5 bg-white w-80">
          <p class="text-sm font-semibold mb-1" style="color:#1C2B3A">Cerrar venta</p>
          <p class="text-sm mb-3" style="color:#6C7B8A">Total a cobrar: <span class="font-bold" style="color:#1C2B3A">$${total.toFixed(2)}</span></p>
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Cantidad recibida</label>
          <input id="vgMontoRecibido" type="number" step="0.01" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
          <div id="vgCambioTxt" class="text-sm mb-3"></div>
          <div id="vgModalMsg"></div>
          <div class="flex gap-2">
            <button id="vgModalCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Cancelar</button>
            <button id="vgModalConfirmar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#3F7A5E; color:#fff">Confirmar venta</button>
          </div>
        </div>
      </div>`;

    const montoInput = document.getElementById("vgMontoRecibido");
    const cambioTxt = document.getElementById("vgCambioTxt");
    montoInput.addEventListener("input", () => {
      const recibido = Number(montoInput.value) || 0;
      if (recibido >= total) {
        cambioTxt.style.color = "#3F7A5E";
        cambioTxt.textContent = `Cambio: $${(recibido - total).toFixed(2)}`;
      } else {
        cambioTxt.style.color = "#B5453A";
        cambioTxt.textContent = `Falta: $${(total - recibido).toFixed(2)}`;
      }
    });

    document.getElementById("vgModalCancelar").addEventListener("click", () => { modal.innerHTML = ""; });

    document.getElementById("vgModalConfirmar").addEventListener("click", async () => {
      const recibido = Number(montoInput.value) || 0;
      const msg = document.getElementById("vgModalMsg");
      msg.innerHTML = "";
      if (recibido < total) { msg.innerHTML = errBox("La cantidad recibida debe ser igual o mayor al total."); return; }

      const p_productos = carrito.map(l => ({ producto_id: l.producto_id, cantidad: l.cantidad }));

      const { data, error } = await sb.rpc("venta_general_cerrar_venta", {
        p_cajero_id: state.usuario.id,
        p_monto_recibido: recibido,
        p_productos,
      });
      if (error) { msg.innerHTML = errBox(error.message); return; }

      modal.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(28,43,58,0.5)">
          <div class="rounded-xl p-5 bg-white w-80 text-center">
            <p class="text-sm font-bold mb-2" style="color:#3F7A5E">✓ Venta cerrada</p>
            <p class="text-xs mb-1" style="color:#1C2B3A">Folio ${data[0].folio_venta}</p>
            <p class="text-xs mb-1" style="color:#1C2B3A">Total: $${Number(data[0].total).toFixed(2)}</p>
            <p class="text-xs" style="color:#1C2B3A">Cambio: $${Number(data[0].cambio).toFixed(2)}</p>
          </div>
        </div>`;
      setTimeout(() => renderVentaGeneral(document.getElementById("main")), 1800);
    });
  }
}

function renderRevisarPedidos(main) {
  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1C2B3A">Revisar Pedidos</h2>
    <div class="max-w-md p-5 rounded-xl bg-white border mb-4" style="border-color:#E1DED5">

      <button id="rpCargar" class="px-3 py-2 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:#1C2B3A">Cargar pedidos de este día</button>
    </div>
    <div id="rpContenido"></div>`;

  document.getElementById("rpCargar").addEventListener("click", cargarPedidos);
  cargarPedidos();

  async function cargarPedidos() {
    const fecha = document.getElementById("rpFecha").value;
    const cont = document.getElementById("rpContenido");
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;

    const { data: md, error: errMd } = await sb.rpc("menu_dia_obtener_por_fecha", { p_fecha: fecha });
    if (errMd) { cont.innerHTML = errBox(errMd.message); return; }
    if (!md || !md[0]) { cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">No hay ningún menú creado para esa fecha.</p>`; return; }
    if (md[0].estado !== "Confirmado") { cont.innerHTML = `<p class="text-xs" style="color:#B5453A">Este menú todavía no está Confirmado, así que no puede tener pedidos.</p>`; return; }

    const menuDiaId = md[0].id;
    const [resumen, detalle, clientes] = await Promise.all([
      sb.rpc("pedidos_resumen", { p_menu_dia_id: menuDiaId }),
      sb.rpc("pedidos_revisar", { p_menu_dia_id: menuDiaId }),
      sb.rpc("clientes_para_envio", { p_menu_dia_id: menuDiaId }),
    ]);

    if (resumen.error || detalle.error || clientes.error) {
      cont.innerHTML = errBox([resumen.error, detalle.error, clientes.error].filter(Boolean).map(e => e.message).join(" | "));
      return;
    }

    const sinResponder = (clientes.data || []).filter(c => !c.ya_respondio).length;
    const filas = detalle.data || [];

    cont.innerHTML = `
      <div class="max-w-md p-5 rounded-xl bg-white border mb-4" style="border-color:#E1DED5">
        <p class="text-sm font-bold mb-2" style="color:#1C2B3A">Resumen (${filas.length} pedidos capturados, ${sinResponder} sin responder)</p>
        <div class="flex flex-col gap-1">
          ${(resumen.data || []).map(r => `
            <div class="flex justify-between text-sm" style="color:#1C2B3A">
              <span>${r.descripcion}</span><span class="jb-mono font-semibold">${r.cantidad}</span>
            </div>`).join("") || `<p class="text-xs" style="color:#6C7B8A">Sin datos todavía.</p>`}
        </div>
      </div>

      <div class="max-w-md">
        <input id="rpBuscar" placeholder="Buscar cliente por nombre…" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border bg-white" style="border-color:#E1DED5" />
        <div id="rpLista" class="flex flex-col gap-2"></div>
      </div>`;

    function pintarLista(filtro) {
      const lista = document.getElementById("rpLista");
      const filtradas = filas.filter(f => !filtro || f.nombre_cliente.toLowerCase().includes(filtro.toLowerCase()));
      lista.innerHTML = filtradas.map(f => `
        <div class="p-3 rounded-lg bg-white border" style="border-color:#E1DED5">
          <div class="flex justify-between">
            <span class="text-sm font-semibold" style="color:#1C2B3A">${f.nombre_cliente}</span>
            <span class="text-xs jb-mono" style="color:#6C7B8A">${f.id_cliente}</span>
          </div>
          <div class="text-xs mt-1" style="color:#1C2B3A">
            ${f.tipo_seleccion === "Guisado" ? f.guisado_nombre : f.tipo_seleccion === "Torta" ? "Torta " + f.torta_nombre : "No consumirá"}
            ${f.agua_nombre ? " · " + f.agua_nombre : ""}
          </div>
          ${f.complementos ? `<div class="text-xs" style="color:#6C7B8A">Complementos: ${f.complementos}</div>` : ""}
          ${f.extras ? `<div class="text-xs" style="color:#B8862E">Extras: ${f.extras}</div>` : ""}
        </div>`).join("") || `<p class="text-xs" style="color:#6C7B8A">Sin resultados.</p>`;
    }
    pintarLista("");
    document.getElementById("rpBuscar").addEventListener("input", (e) => pintarLista(e.target.value));
  }
}
