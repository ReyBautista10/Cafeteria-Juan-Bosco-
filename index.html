function fechaManana() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}

function ligaPedido(qrToken) {
  return new URL("pedido.html?t=" + qrToken, window.location.href).href;
}

function renderEnviarGuisados(main) {
  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:#1C2B3A">Enviar Guisados</h2>
    <div class="max-w-md p-5 rounded-xl bg-white border mb-4" style="border-color:#E1DED5">
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Fecha del menú</label>
      <input id="egFecha" type="date" value="${fechaManana()}" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
      <button id="egCargar" class="px-3 py-2 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:#1C2B3A">Cargar / crear este menú</button>
    </div>
    <div id="egForm"></div>`;

  document.getElementById("egCargar").addEventListener("click", cargarMenuDia);
  cargarMenuDia();

  async function cargarMenuDia() {
    const fecha = document.getElementById("egFecha").value;
    const { data } = await sb.rpc("menu_dia_obtener_por_fecha", { p_fecha: fecha });
    const existente = data && data[0] ? data[0] : null;
    renderFormularioMenu(fecha, existente);
  }

  async function renderFormularioMenu(fecha, existente) {
    const cont = document.getElementById("egForm");
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;

    const [bebidas, tortasProductos] = await Promise.all([
      sb.rpc("productos_buscar", { p_criterio: "Bebida" }),
      sb.rpc("productos_buscar", { p_criterio: "Torta" }),
    ]);

    const esConfirmado = existente && existente.estado === "Confirmado";

    // Mapa en memoria: guisadoId -> array de complementoId marcados como disponibles hoy
    let seleccionGuisados = {};
    if (existente) {
      const { data: filas, error: errG } = await sb.rpc("menu_dia_guisados_obtener", { p_menu_dia_id: existente.id });
      if (!errG) {
        (filas || []).forEach(f => {
          if (!seleccionGuisados[f.guisado_id]) seleccionGuisados[f.guisado_id] = { nombre: f.nombre_guisado, complementos: [] };
          if (f.complemento_id) seleccionGuisados[f.guisado_id].complementos.push(f.complemento_id);
        });
      }
    }

    cont.innerHTML = `
      <div class="max-w-md p-5 rounded-xl bg-white border mb-4" style="border-color:#E1DED5">
        ${esConfirmado ? `<div class="mb-3 text-xs p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">Este menú ya está Confirmado. Solo puedes verlo.</div>` : ""}
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Día del calendario (1-26)</label>
        <input id="egDia" type="number" min="1" max="26" ${esConfirmado ? "disabled" : ""} value="${existente ? existente.dia_guisado : ""}" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
        <button id="egBuscarDia" ${esConfirmado ? "disabled" : ""} class="px-3 py-1.5 rounded-lg text-xs font-semibold mb-3" style="background:#F4F1EB; color:#1C2B3A">Buscar guisados de ese día</button>

        <div id="egGuisadosLista"></div>

        <label class="block text-xs font-semibold mb-1 mt-3" style="color:#6C7B8A">Tortas disponibles</label>
        <div class="mb-3">${(tortasProductos.data || []).map(p => `
          <label class="flex items-center gap-2 text-sm" style="color:#1C2B3A">
            <input type="checkbox" class="tortaChk" value="${p.id}" ${existente && existente.tortas_disponibles && existente.tortas_disponibles.includes(p.id) ? "checked" : ""} ${esConfirmado ? "disabled" : ""} />
            ${p.nombre_producto}
          </label>`).join("") || `<p class="text-xs" style="color:#6C7B8A">No hay productos tipo Torta registrados. Ve a Inventario → Alta para agregarlos.</p>`}
        </div>

        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Aguas disponibles</label>
        <div class="mb-3">${(bebidas.data || []).map(p => `
          <label class="flex items-center gap-2 text-sm" style="color:#1C2B3A">
            <input type="checkbox" class="aguaChk" value="${p.id}" ${existente && existente.aguas_disponibles && existente.aguas_disponibles.includes(p.id) ? "checked" : ""} ${esConfirmado ? "disabled" : ""} />
            ${p.nombre_producto}
          </label>`).join("") || `<p class="text-xs" style="color:#6C7B8A">No hay productos tipo Bebida registrados.</p>`}
        </div>

        <div id="egMsg"></div>
        ${!esConfirmado ? `
          <div class="flex gap-2 mt-2">
            <button id="egGuardarBorrador" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Guardar borrador</button>
            <button id="egConfirmar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1C2B3A; color:#F4F1EB">Confirmar menú</button>
          </div>` : ""}
      </div>
      <div id="egEnvio"></div>`;

    async function buscarGuisadosDelDia(dia) {
      const lista_wrap = document.getElementById("egGuisadosLista");
      lista_wrap.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Buscando…</p>`;
      const { data, error } = await sb.rpc("guisados_del_dia", { p_dia: dia });
      if (error) { lista_wrap.innerHTML = errBox("No se pudieron cargar los guisados: " + error.message); return; }
      const lista = data || [];
      if (lista.length === 0) {
        lista_wrap.innerHTML = `<p class="text-xs mb-2" style="color:#B5453A">No hay guisados registrados para el día ${dia}. Ve a Guisados → Alta para registrar alguno con ese día.</p>`;
        return;
      }
      lista_wrap.innerHTML = `<p class="text-xs font-semibold mb-2 mt-2" style="color:#6C7B8A">Guisados de este día — marca los que se ofrecerán hoy</p>` +
        lista.map(g => `
          <div class="p-3 rounded-lg mb-2" style="background:#F4F1EB">
            <label class="flex items-center gap-2 text-sm font-semibold mb-1" style="color:#1C2B3A">
              <input type="checkbox" class="guisadoChk" value="${g.id}" data-nombre="${g.nombre_guisado}"
                ${(existente && seleccionGuisados[g.id]) || (!existente && lista.length <= 2) ? "checked" : ""}
                ${esConfirmado ? "disabled" : ""} />
              ${g.nombre_guisado}
            </label>
            <div id="egComp_${g.id}" class="ml-6"></div>
          </div>`).join("");

      lista.forEach(g => cargarComplementosGuisado(g.id, seleccionGuisados[g.id] ? seleccionGuisados[g.id].complementos : []));

      if (!esConfirmado) {
        document.querySelectorAll(".guisadoChk").forEach(chk => {
          chk.addEventListener("change", () => {
            document.getElementById(`egComp_${chk.value}`).style.display = chk.checked ? "block" : "none";
          });
        });
      }
    }

    async function cargarComplementosGuisado(guisadoId, seleccionadosPrevios) {
      const el = document.getElementById(`egComp_${guisadoId}`);
      const { data, error } = await sb.rpc("guisados_complementos_obtener", { p_guisado_id: guisadoId });
      if (error) { el.innerHTML = errBox(error.message); return; }
      const lista = data || [];
      if (lista.length === 0) {
        el.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Sin complementos compatibles registrados.</p>`;
        return;
      }
      el.innerHTML = lista.map(c => `
        <label class="flex items-center gap-2 text-xs" style="color:#1C2B3A">
          <input type="checkbox" class="compDelGuisado_${guisadoId}" value="${c.complemento_id}" ${seleccionadosPrevios.includes(c.complemento_id) ? "checked" : ""} ${esConfirmado ? "disabled" : ""} />
          ${c.nombre_complemento}
        </label>`).join("");
    }

    if (existente) buscarGuisadosDelDia(existente.dia_guisado);

    if (!esConfirmado) {
      document.getElementById("egBuscarDia").addEventListener("click", () => {
        const dia = Number(document.getElementById("egDia").value);
        if (dia >= 1 && dia <= 26) buscarGuisadosDelDia(dia);
      });

      document.getElementById("egGuardarBorrador").addEventListener("click", guardarBorrador);
      document.getElementById("egConfirmar").addEventListener("click", async () => {
        try { await guardarBorrador(); } catch { return; }
        const msg = document.getElementById("egMsg");
        const { data: md } = await sb.rpc("menu_dia_obtener_por_fecha", { p_fecha: fecha });
        if (!md || !md[0]) return msg.innerHTML = errBox("Guarda el borrador primero.");
        const { data, error } = await sb.rpc("menu_dia_confirmar", { p_menu_dia_id: md[0].id, p_usuario_id: state.usuario.id });
        if (error) return msg.innerHTML = errBox(error.message);
        msg.innerHTML = okBox("Menú confirmado. Ya puedes enviarlo a los padres.");
        renderFormularioMenu(fecha, { ...md[0], estado: "Confirmado" });
      });
    }

    async function guardarBorrador() {
      const dia = Number(document.getElementById("egDia").value);
      const tortas = [...document.querySelectorAll(".tortaChk:checked")].map(c => c.value);
      const aguas = [...document.querySelectorAll(".aguaChk:checked")].map(c => c.value);
      const guisadosMarcados = [...document.querySelectorAll(".guisadoChk:checked")];
      const msg = document.getElementById("egMsg");
      msg.innerHTML = "";
      if (!dia || dia < 1 || dia > 26) { msg.innerHTML = errBox("El día debe estar entre 1 y 26."); throw new Error("validación"); }
      if (guisadosMarcados.length === 0) { msg.innerHTML = errBox("Marca al menos un guisado a ofrecer."); throw new Error("validación"); }
      if (!fecha) { msg.innerHTML = errBox("Error interno: la fecha no está definida. Recarga la página e inténtalo de nuevo."); throw new Error("validación"); }

      const guisadosPayload = guisadosMarcados.map(chk => ({
        guisado_id: chk.value,
        complementos: [...document.querySelectorAll(`.compDelGuisado_${CSS.escape(chk.value)}:checked`)].map(c => c.value),
      }));

      const idsInvalidos = guisadosPayload.filter(g => !g.guisado_id || g.guisado_id === "undefined" || g.guisado_id.length < 30);
      if (idsInvalidos.length > 0) {
        msg.innerHTML = errBox("Diagnóstico: se detectó un guisado sin id válido antes de enviar. Datos: " + JSON.stringify(guisadosPayload));
        throw new Error("validación");
      }

      const { error } = await sb.rpc("menu_dia_guardar", {
        p_fecha: fecha, p_dia_guisado: dia, p_guisados: guisadosPayload, p_tortas: tortas, p_aguas: aguas,
      });
      if (error) {
        msg.innerHTML = errBox(error.message + " — Datos enviados: " + JSON.stringify({ fecha, dia, guisadosPayload, tortas, aguas }));
        throw error;
      }
      msg.innerHTML = okBox("Borrador guardado.");
    }

    if (esConfirmado) {
      mostrarEnvio(existente.id);
    }
  }

  async function mostrarEnvio(menuDiaId) {
    const cont = document.getElementById("egEnvio");
    cont.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando lista de padres…</p>`;
    const { data, error } = await sb.rpc("clientes_para_envio", { p_menu_dia_id: menuDiaId });
    if (error) { cont.innerHTML = errBox(error.message); return; }
    const lista = data || [];
    const pendientes = lista.filter(c => !c.ya_respondio).length;
    cont.innerHTML = `
      <div class="max-w-md p-5 rounded-xl bg-white border" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-3" style="color:#1C2B3A">Enviar liga a padres (${lista.length} clientes, ${pendientes} sin responder)</p>
        <div class="flex flex-col gap-1 max-h-80 overflow-y-auto">
          ${lista.map(c => `
            <div class="flex items-center justify-between text-sm py-1.5" style="border-bottom:1px solid #E1DED5">
              <div>
                <div style="color:#1C2B3A">${c.nombre_cliente} ${c.ya_respondio ? "✓" : ""}</div>
                <div class="text-xs" style="color:#6C7B8A">${c.id_cliente}</div>
              </div>
              <a class="px-2 py-1 rounded text-xs font-semibold" style="background:#25D366; color:#fff"
                 href="https://wa.me/52${c.telefono}?text=${encodeURIComponent('Hola, este es el menú de mañana en la Cafetería Juan Bosco. Selecciona lo que va a consumir tu hijo(a) aquí: ' + ligaPedido(c.qr_token))}"
                 target="_blank" rel="noopener">Enviar WhatsApp</a>
            </div>`).join("")}
        </div>
      </div>`;
  }
}

// ============================================================
// Módulo Inventario / Productos
// ============================================================

const CATEGORIAS_PRODUCTO = ["Bebida", "Botana", "Alimento", "Torta"];

function renderInventario(main) {
  let html = `<h2 class="text-lg font-bold mb-4" style="color:#1C2B3A">Inventario</h2>`;
  if (state.usuarioSubvista === "menu") {
    html += `<div class="flex gap-3 flex-wrap">
      <button class="inSubtn flex flex-col items-center gap-2 px-6 py-5 rounded-xl w-32 bg-white border" data-v="alta" style="border-color:#E1DED5"><span style="font-size:22px">+</span><span class="text-sm font-semibold" style="color:#1C2B3A">Alta</span></button>
      <button class="inSubtn flex flex-col items-center gap-2 px-6 py-5 rounded-xl w-32 bg-white border" data-v="baja" style="border-color:#E1DED5"><span style="font-size:22px">🗑</span><span class="text-sm font-semibold" style="color:#1C2B3A">Baja</span></button>
      <button class="inSubtn flex flex-col items-center gap-2 px-6 py-5 rounded-xl w-32 bg-white border" data-v="modificar" style="border-color:#E1DED5"><span style="font-size:22px">✎</span><span class="text-sm font-semibold" style="color:#1C2B3A">Modificación</span></button>
      <button class="inSubtn flex flex-col items-center gap-2 px-6 py-5 rounded-xl w-32 bg-white border" data-v="stock" style="border-color:#E1DED5"><span style="font-size:22px">📦</span><span class="text-sm font-semibold" style="color:#1C2B3A">Existencias</span></button>
    </div>`;
    main.innerHTML = html;
    document.querySelectorAll(".inSubtn").forEach(b => b.addEventListener("click", () => { state.usuarioSubvista = b.dataset.v; renderSeccion(); }));
    return;
  }

  html += `<button id="volverInventario" class="text-xs font-semibold mb-4" style="color:#B8862E">← Regresar al menú de Inventario</button><div id="inContenido"></div>`;
  main.innerHTML = html;
  document.getElementById("volverInventario").addEventListener("click", () => { state.usuarioSubvista = "menu"; renderSeccion(); });

  if (state.usuarioSubvista === "alta") renderProductoAlta();
  if (state.usuarioSubvista === "baja") renderProductoBaja();
  if (state.usuarioSubvista === "modificar") renderProductoModificar();
  if (state.usuarioSubvista === "stock") renderProductoStock();
}

function renderProductoAlta() {
  const cont = document.getElementById("inContenido");
  cont.innerHTML = `
    <div class="max-w-sm p-5 rounded-xl bg-white border" style="border-color:#E1DED5">
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nombre del producto</label>
      <input id="prNombre" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Categoría</label>
      <select id="prCategoria" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
        ${CATEGORIAS_PRODUCTO.map(c => `<option value="${c}">${c}</option>`).join("")}
      </select>
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Costo</label>
      <input id="prCosto" type="number" step="0.01" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Existencias iniciales</label>
      <input id="prStock" type="number" value="0" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
      <div id="prMsg"></div>
      <div class="flex gap-2 mt-2">
        <button id="prCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Cancelar</button>
        <button id="prGuardar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#1C2B3A; color:#F4F1EB">Guardar</button>
      </div>
    </div>`;

  document.getElementById("prCancelar").addEventListener("click", () => { state.usuarioSubvista = "menu"; renderSeccion(); });

  document.getElementById("prGuardar").addEventListener("click", async () => {
    const nombre = document.getElementById("prNombre").value;
    const categoria = document.getElementById("prCategoria").value;
    const costo = Number(document.getElementById("prCosto").value);
    const stock = Number(document.getElementById("prStock").value);
    const msg = document.getElementById("prMsg");
    msg.innerHTML = "";
    if (!nombre.trim()) return msg.innerHTML = errBox("Escribe el nombre del producto.");
    if (isNaN(costo) || costo < 0) return msg.innerHTML = errBox("Escribe un costo válido.");
    const { data, error } = await sb.rpc("productos_alta", { p_nombre_producto: nombre, p_categoria_producto: categoria, p_costo_producto: costo, p_stock: stock });
    if (error) return msg.innerHTML = errBox(error.message);
    msg.innerHTML = okBox(`Producto creado: ${data[0].id_producto}`);
    setTimeout(() => { state.usuarioSubvista = "menu"; renderSeccion(); }, 1100);
  });
}

function renderProductoBaja() {
  const cont = document.getElementById("inContenido");
  cont.innerHTML = renderBuscadorGenerico("Buscar producto por nombre o folio…") + `<div id="gMsg" class="mt-3"></div><div id="gModal"></div>`;
  const ctrl = activarBuscadorGenerico("productos_buscar", (r, i) => `
    <button data-idx="${i}" class="w-full text-left px-4 py-2.5 text-sm bg-white" style="${i > 0 ? 'border-top:1px solid #E1DED5' : ''}">
      <div style="color:#1C2B3A" class="font-medium">${r.nombre_producto}</div>
      <div style="color:#6C7B8A" class="text-xs">${r.id_producto} · ${r.categoria_producto} · Stock: ${r.stock}</div>
    </button>`);
  ctrl.setOnFilaClick((r) => {
    document.getElementById("gModal").innerHTML = `
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(28,43,58,0.5)">
        <div class="rounded-xl p-5 bg-white w-72">
          <p class="text-sm mb-4" style="color:#1C2B3A">Confirme que desea eliminar el Producto: <b>${r.nombre_producto}</b> (${r.id_producto})</p>
          <div id="gModalMsg"></div>
          <div class="flex gap-2">
            <button id="gModalCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:#1C2B3A">Cancelar</button>
            <button id="gModalConfirmar" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:#B5453A; color:#fff">Eliminar</button>
          </div>
        </div>
      </div>`;
    document.getElementById("gModalCancelar").addEventListener("click", () => { document.getElementById("gModal").innerHTML = ""; });
    document.getElementById("gModalConfirmar").addEventListener("click", async () => {
      const { error } = await sb.rpc("productos_eliminar", { p_id: r.id });
      if (error) { document.getElementById("gModalMsg").innerHTML = errBox(error.message); return; }
      document.getElementById("gModal").innerHTML = "";
      document.getElementById("gMsg").innerHTML = `<p class="text-xs" style="color:#3F7A5E">✓ Producto eliminado correctamente.</p>`;
      setTimeout(() => { state.usuarioSubvista = "menu"; renderSeccion(); }, 1100);
    });
  });
}

function renderProductoModificar() {
  const cont = document.getElementById("inContenido");
  cont.innerHTML = renderBuscadorGenerico("Buscar producto por nombre o folio…") + `<div id="gForm"></div>`;
  const ctrl = activarBuscadorGenerico("productos_buscar", (r, i) => `
    <button data-idx="${i}" class="w-full text-left px-4 py-2.5 text-sm bg-white" style="${i > 0 ? 'border-top:1px solid #E1DED5' : ''}">
      <div style="color:#1C2B3A" class="font-medium">${r.nombre_producto}</div>
      <div style="color:#6C7B8A" class="text-xs">${r.id_producto} · ${r.categoria_producto} · Stock: ${r.stock}</div>
    </button>`);
  ctrl.setOnFilaClick((r) => {
    document.getElementById("gForm").innerHTML = `
      <div class="max-w-sm p-5 rounded-xl mt-4 bg-white border" style="border-color:#E1DED5">
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Folio (no editable)</label>
        <input value="${r.id_producto}" disabled class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5; color:#6C7B8A; background:#F4F1EB" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nombre</label>
        <input id="prModNombre" value="${r.nombre_producto}" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Categoría</label>
        <select id="prModCategoria" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
          ${CATEGORIAS_PRODUCTO.map(c => `<option value="${c}" ${c === r.categoria_producto ? "selected" : ""}>${c}</option>`).join("")}
        </select>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Costo</label>
        <input id="prModCosto" type="number" step="0.01" value="${r.costo_producto}" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
        <div id="prModMsg"></div>
        <button id="prModGuardar" class="w-full py-2 rounded-lg text-sm font-bold" style="background:#1C2B3A; color:#F4F1EB">Guardar cambios</button>
      </div>`;
    document.getElementById("prModGuardar").addEventListener("click", async () => {
      const nombre = document.getElementById("prModNombre").value;
      const categoria = document.getElementById("prModCategoria").value;
      const costo = Number(document.getElementById("prModCosto").value);
      const msg = document.getElementById("prModMsg");
      msg.innerHTML = "";
      if (isNaN(costo) || costo < 0) return msg.innerHTML = errBox("Escribe un costo válido.");
      const { error } = await sb.rpc("productos_modificar", { p_id: r.id, p_nombre_producto: nombre, p_categoria_producto: categoria, p_costo_producto: costo });
      if (error) return msg.innerHTML = errBox(error.message);
      msg.innerHTML = okBox("Cambios guardados correctamente.");
      setTimeout(() => { state.usuarioSubvista = "menu"; renderSeccion(); }, 1100);
    });
  });
}

function renderProductoStock() {
  const cont = document.getElementById("inContenido");
  cont.innerHTML = `
    <p class="text-xs mb-3" style="color:#6C7B8A">Busca por nombre, o escribe "Bebida", "Botana" o "Alimento" para ver toda una categoría.</p>
    ${renderBuscadorGenerico("Buscar producto…")}`;
  const ctrl = activarBuscadorGenerico("productos_buscar", (r, i) => `
    <div data-idx="${i}" data-pid="${r.id}" class="w-full flex items-center justify-between px-4 py-2.5 text-sm bg-white" style="${i > 0 ? 'border-top:1px solid #E1DED5' : ''}">
      <div>
        <div style="color:#1C2B3A" class="font-medium">${r.nombre_producto}</div>
        <div style="color:#6C7B8A" class="text-xs">${r.id_producto} · ${r.categoria_producto}</div>
      </div>
      <div class="flex items-center gap-2">
        <button class="stkBtn no-select w-7 h-7 rounded flex items-center justify-center" data-delta="-1" data-pid="${r.id}" style="background:#F4F1EB">−</button>
        <span class="stkValor jb-mono text-sm font-bold w-8 text-center" data-pid="${r.id}" style="color:#1C2B3A">${r.stock}</span>
        <button class="stkBtn no-select w-7 h-7 rounded flex items-center justify-center" data-delta="1" data-pid="${r.id}" style="background:#F4F1EB">+</button>
        <button class="stkBtn no-select px-2 h-7 rounded text-xs font-semibold" data-delta="10" data-pid="${r.id}" style="background:#E6F0EA; color:#3F7A5E">+10</button>
      </div>
    </div>`);
  ctrl.setOnFilaClick(() => {});

  const cuerpo = document.getElementById("gBuscarResultados");
  cuerpo.addEventListener("click", async (e) => {
    const btn = e.target.closest(".stkBtn");
    if (!btn) return;
    const pid = btn.dataset.pid;
    const delta = Number(btn.dataset.delta);
    const { data, error } = await sb.rpc("productos_ajustar_stock", { p_id: pid, p_delta: delta });
    if (error) { alert(error.message); return; }
    const valorEl = document.querySelector(`.stkValor[data-pid="${pid}"]`);
    if (valorEl && data && data[0]) valorEl.textContent = data[0].stock;
  });
}
