<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pedido — Cafetería Juan Bosco</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .jb-brand { font-family: 'Fraunces', serif; }
</style>
</head>
<body class="bg-[#F4F1EB] min-h-screen">
<div id="app" class="max-w-sm mx-auto p-5"></div>

<script>
const SUPABASE_URL = "https://pvqmncpebgrmoondwmib.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2cW1uY3BlYmdybW9vbmR3bWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Mzg4ODMsImV4cCI6MjEwMjMxNDg4M30.LKVzQwWWlfn1Cir332ZWax5UskxkKJtq5Q4-yGl6v44";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById("app");
const params = new URLSearchParams(window.location.search);
const token = params.get("t");

function errBox(t) { return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${t}</div>`; }
function okBox(t) { return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">${t}</div>`; }

async function init() {
  if (!token) {
    app.innerHTML = `<div class="pt-10 text-center">${errBox("Esta liga no es válida. Pide a la cafetería que te comparta tu liga personal.")}</div>`;
    return;
  }
  app.innerHTML = `<div class="pt-10 text-center text-sm" style="color:#6C7B8A">Cargando menú…</div>`;

  const { data, error } = await sb.rpc("pedido_menu_obtener", { p_token: token });
  if (error) {
    app.innerHTML = `<div class="pt-10 text-center">${errBox(error.message)}</div>`;
    return;
  }
  const m = data[0];

  const header = `
    <div class="text-center mb-5">
      <div class="jb-brand text-xl font-semibold" style="color:#1C2B3A">Cafetería Juan Bosco</div>
      <div class="text-sm mt-1" style="color:#6C7B8A">Hola, ${m.nombre_cliente}</div>
    </div>`;

  if (!m.menu_dia_id || !m.abierto) {
    app.innerHTML = header + `<div class="p-4 rounded-xl text-sm text-center" style="background:#fff; border:1px solid #E1DED5; color:#6C7B8A">
      No hay ningún menú disponible para seleccionar en este momento. Vuelve a intentarlo más tarde, o revisa si el horario de captura ya cerró.
    </div>`;
    return;
  }

  const [g1c, g2c, tortas, aguas, compActuales] = await Promise.all([
    m.complementos_g1_disponibles && m.complementos_g1_disponibles.length ? sb.rpc("complementos_por_ids", { p_ids: m.complementos_g1_disponibles }) : { data: [] },
    m.complementos_g2_disponibles && m.complementos_g2_disponibles.length ? sb.rpc("complementos_por_ids", { p_ids: m.complementos_g2_disponibles }) : { data: [] },
    m.tortas_disponibles && m.tortas_disponibles.length ? sb.rpc("productos_por_ids", { p_ids: m.tortas_disponibles }) : { data: [] },
    m.aguas_disponibles && m.aguas_disponibles.length ? sb.rpc("productos_por_ids", { p_ids: m.aguas_disponibles }) : { data: [] },
    m.pedido_existente_id ? sb.rpc("pedido_complementos_obtener", { p_pedido_id: m.pedido_existente_id }) : { data: [] },
  ]);

  const compSeleccionados = (compActuales.data || []).map(c => c.complemento_id);
  const cierre = new Date(m.cierre_pedidos_ts);

  app.innerHTML = header + `
    <div class="p-4 rounded-xl mb-4" style="background:#fff; border:1px solid #E1DED5">
      <p class="text-xs mb-3" style="color:#6C7B8A">Puedes cambiar tu selección hasta las ${cierre.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" })} de hoy.</p>

      <label class="flex items-start gap-2 p-2 rounded-lg mb-2" style="background:#F4F1EB">
        <input type="radio" name="opcion" value="Guisado1" ${m.opcion_actual === "Guisado1" ? "checked" : ""} />
        <span class="text-sm font-semibold" style="color:#1C2B3A">${m.guisado_1_nombre}</span>
      </label>
      <div id="compG1" class="ml-6 mb-2"></div>

      <label class="flex items-start gap-2 p-2 rounded-lg mb-2" style="background:#F4F1EB">
        <input type="radio" name="opcion" value="Guisado2" ${m.opcion_actual === "Guisado2" ? "checked" : ""} />
        <span class="text-sm font-semibold" style="color:#1C2B3A">${m.guisado_2_nombre}</span>
      </label>
      <div id="compG2" class="ml-6 mb-2"></div>

      ${(tortas.data || []).length > 0 ? `
      <label class="flex items-start gap-2 p-2 rounded-lg mb-2" style="background:#F4F1EB">
        <input type="radio" name="opcion" value="Torta" ${m.opcion_actual === "Torta" ? "checked" : ""} />
        <span class="text-sm font-semibold" style="color:#1C2B3A">Torta</span>
      </label>
      <div class="ml-6 mb-2">
        <select id="tortaSel" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
          ${(tortas.data || []).map(t => `<option value="${t.id}" ${t.id === m.torta_actual ? "selected" : ""}>${t.nombre_producto}</option>`).join("")}
        </select>
      </div>` : ""}

      <label class="flex items-start gap-2 p-2 rounded-lg mb-3" style="background:#F4F1EB">
        <input type="radio" name="opcion" value="Ninguno" ${m.opcion_actual === "Ninguno" || !m.opcion_actual ? "checked" : ""} />
        <span class="text-sm font-semibold" style="color:#1C2B3A">No consumirá</span>
      </label>

      ${(aguas.data || []).length > 0 ? `
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Agua</label>
      <select id="aguaSel" class="w-full px-2 py-1.5 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
        <option value="">Ninguna</option>
        ${(aguas.data || []).map(a => `<option value="${a.id}" ${a.id === m.agua_actual ? "selected" : ""}>${a.nombre_producto}</option>`).join("")}
      </select>` : ""}

      <div id="pedMsg"></div>
      <button id="pedGuardar" class="w-full py-2.5 rounded-lg text-sm font-bold" style="background:#1C2B3A; color:#F4F1EB">Guardar selección</button>
    </div>`;

  function pintarComplementos(contId, lista, maxSeleccion) {
    const el = document.getElementById(contId);
    if (!lista || lista.length === 0) { el.innerHTML = ""; return; }
    el.innerHTML = lista.map(c => `
      <label class="flex items-center gap-2 text-xs" style="color:#1C2B3A">
        <input type="checkbox" class="compChk_${contId}" value="${c.id}" ${compSeleccionados.includes(c.id) ? "checked" : ""} />
        ${c.nombre_complemento}
      </label>`).join("");
    el.querySelectorAll(`.compChk_${contId}`).forEach(chk => {
      chk.addEventListener("change", () => {
        const marcados = el.querySelectorAll(`.compChk_${contId}:checked`);
        if (marcados.length > 2) chk.checked = false;
      });
    });
  }
  pintarComplementos("compG1", g1c.data, 2);
  pintarComplementos("compG2", g2c.data, 2);

  document.getElementById("pedGuardar").addEventListener("click", async () => {
    const opcionEl = document.querySelector('input[name="opcion"]:checked');
    const opcion = opcionEl ? opcionEl.value : "Ninguno";
    const msg = document.getElementById("pedMsg");
    msg.innerHTML = "";

    let complementos = [];
    let torta_id = null;
    let agua_id = document.getElementById("aguaSel")?.value || null;

    if (opcion === "Guisado1") complementos = [...document.querySelectorAll(".compChk_compG1:checked")].map(c => c.value);
    if (opcion === "Guisado2") complementos = [...document.querySelectorAll(".compChk_compG2:checked")].map(c => c.value);
    if (opcion === "Torta") {
      torta_id = document.getElementById("tortaSel")?.value || null;
      agua_id = null;
    }
    if (opcion === "Ninguno") { agua_id = null; }

    const { error } = await sb.rpc("pedido_guardar", {
      p_token: token, p_menu_dia_id: m.menu_dia_id, p_opcion: opcion,
      p_torta_id: torta_id, p_agua_id: agua_id, p_complementos: complementos,
    });
    if (error) { msg.innerHTML = errBox(error.message); return; }
    msg.innerHTML = okBox("¡Listo! Tu selección quedó guardada. Puedes volver a cambiarla antes del cierre si lo necesitas.");
  });
}

init();
</script>
</body>
</html>
