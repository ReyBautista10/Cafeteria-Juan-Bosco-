<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pedido — Cafetería Juan Bosco</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .jb-brand { font-family: 'Fraunces', serif; }
</style>
</head>
<body class="bg-[#F4F1EB] min-h-screen">
<div id="app" class="max-w-sm mx-auto p-5"></div>

<script>
const SUPABASE_URL = "https://pvqmncpebgrmoondwmib.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2cW1uY3BlYmdybW9vbmR3bWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Mzg4ODMsImV4cCI6MjEwMjMxNDg4M30.LKVzQwWWlfn1Cir332ZWax5UskxkKJtq5Q4-yGl6v44";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById("app");
const params = new URLSearchParams(window.location.search);
const token = params.get("t");

function errBox(t) { return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${t}</div>`; }
function okBox(t) { return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">${t}</div>`; }

async function init() {
  if (!token) {
    app.innerHTML = `<div class="pt-10 text-center">${errBox("Esta liga no es válida. Pide a la cafetería que te comparta tu liga personal.")}</div>`;
    return;
  }
  app.innerHTML = `<div class="pt-10 text-center text-sm" style="color:#6C7B8A">Cargando menú…</div>`;

  const { data, error } = await sb.rpc("pedido_menu_obtener", { p_token: token });
  if (error) {
    app.innerHTML = `<div class="pt-10 text-center">${errBox(error.message)}</div>`;
    return;
  }
  const m = data[0];

  const header = `
    <div class="text-center mb-5">
      <div class="jb-brand text-xl font-semibold" style="color:#1C2B3A">Cafetería Juan Bosco</div>
      <div class="text-sm mt-1" style="color:#6C7B8A">Hola, ${m.nombre_cliente}</div>
    </div>`;

  if (!m.menu_dia_id || !m.abierto) {
    app.innerHTML = header + `<div class="p-4 rounded-xl text-sm text-center" style="background:#fff; border:1px solid #E1DED5; color:#6C7B8A">
      No hay ningún menú disponible para seleccionar en este momento. Vuelve a intentarlo más tarde, o revisa si el horario de captura ya cerró.
    </div>`;
    return;
  }

  const [guisadosFilas, tortas, aguas, compActuales, extrasActuales] = await Promise.all([
    sb.rpc("menu_dia_guisados_obtener", { p_menu_dia_id: m.menu_dia_id }),
    m.tortas_disponibles && m.tortas_disponibles.length ? sb.rpc("productos_por_ids", { p_ids: m.tortas_disponibles }) : { data: [] },
    m.aguas_disponibles && m.aguas_disponibles.length ? sb.rpc("productos_por_ids", { p_ids: m.aguas_disponibles }) : { data: [] },
    m.pedido_existente_id ? sb.rpc("pedido_complementos_obtener", { p_pedido_id: m.pedido_existente_id }) : { data: [] },
    m.pedido_existente_id ? sb.rpc("pedido_extras_obtener", { p_pedido_id: m.pedido_existente_id }) : { data: [] },
  ]);

  let diagnostico = "";
  if (guisadosFilas.error) diagnostico += "guisados: " + guisadosFilas.error.message + " | ";
  if (tortas.error) diagnostico += "tortas: " + tortas.error.message + " | ";
  if (aguas.error) diagnostico += "aguas: " + aguas.error.message + " | ";
  if (compActuales.error) diagnostico += "complementos actuales: " + compActuales.error.message + " | ";
  if (extrasActuales.error) diagnostico += "extras actuales: " + extrasActuales.error.message + " | ";

  const guisadosMap = {};
  (guisadosFilas.data || []).forEach(f => {
    if (!guisadosMap[f.guisado_id]) guisadosMap[f.guisado_id] = { id: f.guisado_id, nombre: f.nombre_guisado, complementos: [] };
    if (f.complemento_id) guisadosMap[f.guisado_id].complementos.push({ id: f.complemento_id, nombre: f.complemento_nombre });
  });
  const guisados = Object.values(guisadosMap);

  const compSeleccionados = (compActuales.data || []).map(c => c.complemento_id);
  const cierre = new Date(m.cierre_pedidos_ts);

  app.innerHTML = header + (diagnostico ? errBox("Diagnóstico: " + diagnostico) : "") + `
    <div class="p-4 rounded-xl mb-4" style="background:#fff; border:1px solid #E1DED5">
      <p class="text-xs mb-3" style="color:#6C7B8A">Puedes cambiar tu selección hasta las ${cierre.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" })} de hoy.</p>

      ${guisados.map(g => `
        <label class="flex items-start gap-2 p-2 rounded-lg mb-1" style="background:#F4F1EB">
          <input type="radio" name="opcion" value="guisado_${g.id}" ${m.tipo_seleccion_actual === "Guisado" && m.guisado_actual === g.id ? "checked" : ""} />
          <span class="text-sm font-semibold" style="color:#1C2B3A">${g.nombre}</span>
        </label>
        <div id="comp_${g.id}" class="ml-6 mb-2"></div>
      `).join("")}

      ${(tortas.data || []).length > 0 ? `
      <label class="flex items-start gap-2 p-2 rounded-lg mb-2" style="background:#F4F1EB">
        <input type="radio" name="opcion" value="Torta" ${m.tipo_seleccion_actual === "Torta" ? "checked" : ""} />
        <span class="text-sm font-semibold" style="color:#1C2B3A">Torta</span>
      </label>
      <div class="ml-6 mb-2">
        <select id="tortaSel" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
          ${(tortas.data || []).map(t => `<option value="${t.id}" ${t.id === m.torta_actual ? "selected" : ""}>${t.nombre_producto}</option>`).join("")}
        </select>
      </div>` : ""}

      <label class="flex items-start gap-2 p-2 rounded-lg mb-3" style="background:#F4F1EB">
        <input type="radio" name="opcion" value="Ninguno" ${m.tipo_seleccion_actual === "Ninguno" || !m.tipo_seleccion_actual ? "checked" : ""} />
        <span class="text-sm font-semibold" style="color:#1C2B3A">No consumirá</span>
      </label>

      ${(aguas.data || []).length > 0 ? `
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Agua</label>
      <select id="aguaSel" class="w-full px-2 py-1.5 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
        <option value="">Ninguna</option>
        ${(aguas.data || []).map(a => `<option value="${a.id}" ${a.id === m.agua_actual ? "selected" : ""}>${a.nombre_producto}</option>`).join("")}
      </select>` : ""}

      <div id="pedMsg"></div>

      <div class="p-3 rounded-lg mb-3" style="background:#F4F1EB">
        <p class="text-sm font-semibold mb-2" style="color:#1C2B3A">¿Desea agregar extras a su orden (complementos, tortas, extra del guisado)?</p>
        <div class="flex gap-2 mb-2">
          <button id="extraNoBtn" type="button" class="flex-1 py-1.5 rounded-lg text-xs font-semibold" style="background:#1C2B3A; color:#fff">No</button>
          <button id="extraSiBtn" type="button" class="flex-1 py-1.5 rounded-lg text-xs font-semibold" style="background:#fff; color:#1C2B3A; border:1px solid #E1DED5">Sí</button>
        </div>
        <div id="extrasWrap" style="display:none"></div>
      </div>

      <button id="pedGuardar" class="w-full py-2.5 rounded-lg text-sm font-bold" style="background:#1C2B3A; color:#F4F1EB">Guardar selección</button>
    </div>
    <div id="pedConfirmacion"></div>`;

  // Mapas de nombres para armar el resumen final
  const nombresComplementos = {};
  guisados.forEach(g => g.complementos.forEach(c => { nombresComplementos[c.id] = c.nombre; }));
  const nombresTortas = {};
  (tortas.data || []).forEach(t => { nombresTortas[t.id] = t.nombre_producto; });
  const nombresAguas = {};
  (aguas.data || []).forEach(a => { nombresAguas[a.id] = a.nombre_producto; });
  const nombresGuisados = {};
  guisados.forEach(g => { nombresGuisados[g.id] = g.nombre; });

  // Extras ya guardados previamente (si el cliente ya había hecho su pedido antes)
  const extrasPrevios = extrasActuales.data || [];
  const extraGuisadoPrevio = extrasPrevios.some(e => e.tipo === "Guisado");
  const extraComplementosPrevios = extrasPrevios.filter(e => e.tipo === "Complemento").map(e => e.referencia_id);
  const extraTortasPrevias = extrasPrevios.filter(e => e.tipo === "Torta").map(e => e.referencia_id);

  function pintarExtrasWrap() {
    const wrap = document.getElementById("extrasWrap");
    wrap.style.display = "block";
    wrap.innerHTML = `
      <label class="flex items-center gap-2 text-sm mb-1" style="color:#1C2B3A">
        <input type="checkbox" id="extraGuisadoChk" ${extraGuisadoPrevio ? "checked" : ""} />
        Extra de guisado (otra porción del guisado que elegiste)
      </label>
      ${Object.keys(nombresComplementos).length > 0 ? `
        <p class="text-xs font-semibold mt-2 mb-1" style="color:#6C7B8A">Complementos extra</p>
        ${Object.entries(nombresComplementos).map(([id, nombre]) => `
          <label class="flex items-center gap-2 text-sm" style="color:#1C2B3A">
            <input type="checkbox" class="extraCompChk" value="${id}" ${extraComplementosPrevios.includes(id) ? "checked" : ""} /> ${nombre}
          </label>`).join("")}` : ""}
      ${Object.keys(nombresTortas).length > 0 ? `
        <p class="text-xs font-semibold mt-2 mb-1" style="color:#6C7B8A">Tortas extra</p>
        ${Object.entries(nombresTortas).map(([id, nombre]) => `
          <label class="flex items-center gap-2 text-sm" style="color:#1C2B3A">
            <input type="checkbox" class="extraTortaChk" value="${id}" ${extraTortasPrevias.includes(id) ? "checked" : ""} /> ${nombre}
          </label>`).join("")}` : ""}`;
  }

  function activarBotonExtras(activo) {
    const siBtn = document.getElementById("extraSiBtn");
    const noBtn = document.getElementById("extraNoBtn");
    siBtn.style.background = activo ? "#1C2B3A" : "#fff";
    siBtn.style.color = activo ? "#fff" : "#1C2B3A";
    noBtn.style.background = activo ? "#fff" : "#1C2B3A";
    noBtn.style.color = activo ? "#1C2B3A" : "#fff";
  }

  document.getElementById("extraSiBtn").addEventListener("click", () => {
    activarBotonExtras(true);
    pintarExtrasWrap();
  });

  document.getElementById("extraNoBtn").addEventListener("click", () => {
    activarBotonExtras(false);
    document.getElementById("extrasWrap").style.display = "none";
    document.getElementById("extrasWrap").innerHTML = "";
  });

  // Si ya tenía extras guardados, mostrarlos precargados desde el inicio
  if (extrasPrevios.length > 0) {
    activarBotonExtras(true);
    pintarExtrasWrap();
  }

  function calcularLineas() {
    const opcionEl = document.querySelector('input[name="opcion"]:checked');
    const valor = opcionEl ? opcionEl.value : "Ninguno";
    const aguaSelId = document.getElementById("aguaSel")?.value || null;
    const lineas = [];

    if (valor.startsWith("guisado_")) {
      const gId = valor.replace("guisado_", "");
      lineas.push("1 " + nombresGuisados[gId]);
      [...document.querySelectorAll(`.compChk_${gId}:checked`)].forEach(c => lineas.push("1 " + nombresComplementos[c.value]));
    } else if (valor === "Torta") {
      const tId = document.getElementById("tortaSel")?.value || null;
      if (tId) lineas.push("1 Torta " + nombresTortas[tId]);
    }
    if (valor.startsWith("guisado_") && aguaSelId) lineas.push("1 " + nombresAguas[aguaSelId]);

    if (document.getElementById("extraGuisadoChk")?.checked) lineas.push("1 Extra de guisado");
    [...document.querySelectorAll(".extraCompChk:checked")].forEach(c => lineas.push("1 " + nombresComplementos[c.value]));
    [...document.querySelectorAll(".extraTortaChk:checked")].forEach(c => lineas.push("1 Torta " + nombresTortas[c.value]));

    return lineas;
  }

  function mostrarResumen() {
    const lineas = calcularLineas();
    document.getElementById("pedConfirmacion").innerHTML = `
      <div class="p-4 rounded-xl mt-4" style="background:#E6F0EA; border:1px solid #3F7A5E">
        <p class="text-sm font-semibold mb-2" style="color:#1C2B3A">${m.nombre_cliente} tu orden quedó de la siguiente manera:</p>
        <div class="text-sm" style="color:#1C2B3A">${lineas.map(l => `<div>${l}</div>`).join("")}</div>
      </div>`;
  }

  // Si ya tenía un pedido guardado, mostrar su resumen de una vez al entrar
  if (m.pedido_existente_id) mostrarResumen();

  guisados.forEach(g => {
    const el = document.getElementById(`comp_${g.id}`);
    if (g.complementos.length === 0) { el.innerHTML = ""; return; }
    el.innerHTML = g.complementos.map(c => `
      <label class="flex items-center gap-2 text-xs" style="color:#1C2B3A">
        <input type="checkbox" class="compChk_${g.id}" value="${c.id}" ${compSeleccionados.includes(c.id) && m.guisado_actual === g.id ? "checked" : ""} />
        ${c.nombre}
      </label>`).join("");
    el.querySelectorAll(`.compChk_${g.id}`).forEach(chk => {
      chk.addEventListener("change", () => {
        const marcados = el.querySelectorAll(`.compChk_${g.id}:checked`);
        if (marcados.length > 2) chk.checked = false;
      });
    });
  });

  document.querySelectorAll('input[name="opcion"]').forEach(radio => {
    radio.addEventListener("change", () => {
      guisados.forEach(g => {
        if (`guisado_${g.id}` !== radio.value) {
          document.querySelectorAll(`.compChk_${g.id}`).forEach(chk => { chk.checked = false; });
        }
      });
    });
  });

  document.getElementById("pedGuardar").addEventListener("click", async () => {
    const opcionEl = document.querySelector('input[name="opcion"]:checked');
    const valor = opcionEl ? opcionEl.value : "Ninguno";
    const msg = document.getElementById("pedMsg");
    msg.innerHTML = "";

    let tipo_seleccion = "Ninguno";
    let guisado_id = null;
    let torta_id = null;
    let agua_id = document.getElementById("aguaSel")?.value || null;
    let complementos = [];

    if (valor.startsWith("guisado_")) {
      tipo_seleccion = "Guisado";
      guisado_id = valor.replace("guisado_", "");
      complementos = [...document.querySelectorAll(`.compChk_${guisado_id}:checked`)].map(c => c.value);
    } else if (valor === "Torta") {
      tipo_seleccion = "Torta";
      torta_id = document.getElementById("tortaSel")?.value || null;
      agua_id = null;
    } else {
      agua_id = null;
    }

    const extra_guisado = document.getElementById("extraGuisadoChk")?.checked || false;
    const extra_complementos = [...document.querySelectorAll(".extraCompChk:checked")].map(c => c.value);
    const extra_tortas = [...document.querySelectorAll(".extraTortaChk:checked")].map(c => c.value);

    const { error } = await sb.rpc("pedido_guardar", {
      p_token: token, p_menu_dia_id: m.menu_dia_id, p_tipo_seleccion: tipo_seleccion,
      p_guisado_id: guisado_id, p_torta_id: torta_id, p_agua_id: agua_id, p_complementos: complementos,
      p_extra_guisado: extra_guisado, p_extra_complementos: extra_complementos, p_extra_tortas: extra_tortas,
    });
    if (error) { msg.innerHTML = errBox(error.message); return; }

    mostrarResumen();
    msg.innerHTML = okBox("¡Listo! Puedes volver a cambiarla antes del cierre si lo necesitas.");
  });
}

init();
</script>
</body>
</html>
